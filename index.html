<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Dev_Anabel — Retro Development Bot</title>
<style>
:root{--bg:#050505;--panel:#000;--border:#333;--fg:#00ff33;--glow:rgba(0,255,51,.2);--muted:#888;--warn:#ffcc00}
[data-theme="amber"]{--fg:#ffb000;--glow:rgba(255,176,0,.2)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:monospace}
body{padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px;overscroll-behavior:contain}
button,input,textarea,select{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
header{width:100%;max-width:1400px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:20px;letter-spacing:2px;text-transform:uppercase}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tool,.theme select{background:#101010;color:var(--fg);border:1px solid var(--fg);padding:7px 10px;cursor:pointer}
.theme{display:flex;gap:5px;align-items:center}
#file-input{display:none}
.mobile-tabs{display:none;width:100%;gap:5px}
.tab{flex:1;background:#101010;color:var(--muted);border:1px solid var(--border);padding:10px;cursor:pointer}
.tab.active{color:var(--fg);border-color:var(--fg)}
#workspace{width:1400px;max-width:100%;height:min(480px,64vh);min-height:310px;display:flex;gap:12px}
.panel{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.label{font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase}
canvas,#sandbox,#editor{width:100%;height:100%;min-height:0}
canvas{display:block;background:#000;border:2px solid var(--border);box-shadow:0 0 20px var(--glow)}
#editor-wrap{position:relative;flex:1;min-height:0;display:flex}#line-numbers{flex:0 0 42px;overflow:hidden;white-space:pre;text-align:right;user-select:none;background:#070707;color:var(--muted);border:2px solid var(--border);border-right:0;padding:12px 7px 12px 3px;font:12px/1.4 "Courier New",monospace;tab-size:4;line-height:1.4}#editor{flex:1;min-width:0;resize:none;background:#0b0b0b;color:var(--fg);border:2px solid var(--border);padding:12px;outline:none;white-space:pre;font:12px/1.4 "Courier New",monospace;tab-size:4}#editor-meta{position:absolute;top:5px;right:8px;z-index:4;font-size:9px;color:var(--muted);pointer-events:none;background:#000b;padding:2px 5px}#autocomplete{display:none;position:absolute;z-index:20;left:10px;top:10px;width:min(390px,calc(100% - 20px));max-height:210px;overflow:auto;background:#050505;border:1px solid var(--fg);box-shadow:0 0 15px var(--glow);font:11px/1.35 "Courier New",monospace}#autocomplete.show{display:block}.ac-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 8px;cursor:pointer}.ac-item:hover,.ac-item.selected{background:var(--fg);color:#000}.ac-kind{opacity:.7}.ac-item.selected .ac-kind{opacity:.85}.ac-empty{padding:7px 8px;color:var(--muted)}
#sandbox{display:block;border:2px solid var(--border);background:#000}
#controls{width:1400px;max-width:100%;display:flex;flex-direction:column;gap:7px}
#input-row{display:flex;gap:6px}
#input{flex:1;min-width:0;background:#000;color:var(--fg);border:1px solid var(--fg);padding:12px;font-size:16px}
#send{background:var(--fg);color:#000;border:0;padding:0 22px;font-weight:bold;cursor:pointer}
#quick{display:flex;gap:5px;flex-wrap:wrap}
.quick{background:#101010;color:var(--fg);border:1px solid var(--fg);padding:5px 8px;font-size:10px;cursor:pointer}
#sources{display:none;max-height:130px;overflow:auto;background:#030303;border-top:1px solid var(--border);padding:7px;font-size:10px}
#sources.show{display:block}
.source{margin-bottom:6px;line-height:1.35}.source a{color:var(--fg);word-break:break-all}.source span{color:var(--muted)}
#review{width:1400px;max-width:100%;display:grid;grid-template-columns:minmax(260px,.7fr) minmax(360px,1.3fr);gap:8px}
.review-box{background:#030303;border:2px solid var(--border);padding:9px;min-width:0}
.review-title{color:var(--fg);font-size:11px;text-transform:uppercase;margin-bottom:7px}
#review-summary{font-size:11px;line-height:1.4;color:var(--muted);margin-bottom:7px}
#review-list{margin:0;padding-left:18px;font-size:11px;line-height:1.45}
#review-list li{margin:4px 0}
#corrected-output{width:100%;height:240px;resize:vertical;background:#080808;color:var(--fg);border:1px solid var(--fg);padding:9px;font:11px/1.4 "Courier New",monospace;white-space:pre;tab-size:4}
#copy-corrected{margin-top:7px;background:#101010;color:var(--fg);border:1px solid var(--fg);padding:7px 10px;cursor:pointer}
@media(max-width:900px){#review{grid-template-columns:1fr}}
#status{font-size:10px;color:var(--muted);min-height:13px}
#pad{display:none;justify-content:center;gap:10px}
.pad{background:#202020;color:var(--fg);border:2px solid var(--fg);padding:13px 24px;touch-action:manipulation}
.drop{border-color:var(--fg)!important;box-shadow:0 0 15px var(--glow)!important}
@media(max-width:900px){.mobile-tabs{display:flex}.panel{display:none}.panel.visible{display:flex}#workspace{height:58vh;min-height:290px}.toolbar{width:100%}.toolbar>*{flex:1}#pad{display:flex}}
@media(max-width:520px){h1{font-size:16px}.theme{width:100%}.theme select{flex:1}#input-row{flex-direction:column}#send{min-height:44px}.quick{flex:1;text-align:center}.pad{flex:1}}
</style>
</head>
<body>
<header>
<h1>Dev_Anabel Core System</h1>
<div class="toolbar">
<label class="tool" for="file-input">📎 ANEXAR</label>
<input id="file-input" type="file" multiple accept=".html,.htm,.js,.mjs,.css,.json,.txt,.md,.xml,.svg,.csv,.py,.java,.c,.cpp,.h,.hpp,.cs,.ts,.tsx,.jsx">
<button class="tool" id="export" type="button">💾 EXPORTAR</button>
<button class="tool" id="undo" type="button">↶ DESFAZER</button>
<div class="theme"><span>CRT:</span><select id="theme"><option value="green">VERDE</option><option value="amber">ÂMBAR</option></select></div>
</div>
</header>
<div class="mobile-tabs">
<button class="tab active" type="button" data-tab="0">Terminal</button>
<button class="tab" type="button" data-tab="1">Código</button>
<button class="tab" type="button" data-tab="2">Live View</button>
</div>
<main id="workspace">
<section class="panel visible" id="p0"><div class="label">📟 Terminal CRT</div><canvas id="terminal" width="450" height="450"></canvas><div id="sources"></div></section>
<section class="panel" id="p1"><div class="label">💻 Professor Python / Código Fonte</div><div id="editor-wrap"><div id="line-numbers" aria-hidden="true">1</div><textarea id="editor" spellcheck="false" placeholder="# Python: escreva aqui e pressione Ctrl+Espaço para sugestões..."></textarea><div id="editor-meta">LINGUAGEM: AUTO · AUTOCOMPLETE: CTRL+ESPAÇO</div><div id="autocomplete" role="listbox" aria-label="Sugestões de código"></div></div></section>
<section class="panel" id="p2"><div class="label">🚀 Sandbox de Execução</div><iframe id="sandbox" title="Live View" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></section>
</main>
<section id="controls">
<div id="input-row"><input id="input" autocomplete="off" autofocus placeholder="Ex.: Anabel, me dê uma ideia de jogo de estratégia 8-bit"><button id="send" type="button">EXECUTAR</button></div>
<div id="quick">
<button class="quick" data-command="/ajuda" type="button">/ajuda</button>
<button class="quick" data-command="/analisar" type="button">/analisar</button>
<button class="quick" data-command="/corrigir" type="button">/corrigir</button>
<button class="quick" data-command="/melhorar" type="button">/melhorar</button>
<button class="quick" data-command="/refatorar" type="button">/refatorar</button>
<button class="quick" data-command="/executar" type="button">/executar</button>
<button class="quick" data-command="/ideias jogo estratégia 8-bit" type="button">/ideias</button>
<button class="quick" data-command="/fontes" type="button">/fontes</button>
<button class="quick" data-command="/ollama" type="button">/ollama</button>
</div>
<div id="status"></div>
</section>
<section id="review" aria-live="polite">
<div class="review-box">
<div class="review-title">🔎 Ideias de melhoria</div>
<div id="review-summary">Analise ou corrija um código para gerar recomendações técnicas.</div>
<ul id="review-list"></ul>
</div>
<div class="review-box">
<div class="review-title">🛠️ Código corrigido</div>
<textarea id="corrected-output" spellcheck="false" readonly placeholder="O código corrigido aparecerá aqui."></textarea>
<button id="copy-corrected" type="button">COPIAR CÓDIGO</button>
</div>
</section>
<section id="pad"><button class="pad" id="left" type="button">◀ ESQ</button><button class="pad" id="fire" type="button">FOGO</button><button class="pad" id="right" type="button">DIR ▶</button></section>
<script>

"use strict";
(()=> {
  const $=(s,r=document)=>r.querySelector(s);
  const qsa=(s,r=document)=>[...r.querySelectorAll(s)];
  const canvas=$("#terminal"),ctx=canvas.getContext("2d",{alpha:false});
  const editor=$("#editor"),sandbox=$("#sandbox"),input=$("#input"),send=$("#send");
  const fileInput=$("#file-input"),sources=$("#sources"),status=$("#status");
  const reviewSummary=$("#review-summary"),reviewList=$("#review-list"),correctedOutput=$("#corrected-output"),copyCorrected=$("#copy-corrected");
  const autocomplete=$("#autocomplete"),editorMeta=$("#editor-meta"),lineNumbers=$("#line-numbers");
  const STORAGE_KEY="dev-anabel-session-v2";
  let runtimeKind="",pythonRuntimeReady=false,pendingPythonCode=null,acItems=[],acIndex=0,autonomousBusy=false,autonomousLastKey="",autonomousTimer=null,saveTimer=null,resizeTimer=null,lastShownLanguage="";
  const state={
    theme:"green",color:"#00ff33",busy:false,queued:false,sandboxUrl:"",language:"auto",
    history:[
      "ANABEL: sistema iniciado.",
      "ANABEL: bot local sem LLM.",
      "ANABEL: conhecimento, regras, pesquisa e ferramentas ativas."
    ],
    sourceList:[],snapshots:[],ideas:[],selectedIdea:null,pendingAction:null,
    autonomous:{enabled:true,lastQuery:"",lastReason:"",candidateCount:0,selected:"",score:0,lastAt:0,alternatives:[],plan:null},
    review:{issues:[],improvements:[],correctedCode:""}
  };

  const norm=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
  const esc=v=>String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
  function log(v){state.history.push(String(v));drawLater();}
  function drawLater(){if(state.queued)return;state.queued=requestAnimationFrame(()=>{state.queued=false;draw();});}
  function wrapTerminalText(text,chars){
    const lines=[];
    for(const rawLine of String(text??"").split(/\r?\n/)){
      const line=rawLine.trimEnd();
      if(!line){lines.push("");continue;}
      let rest=line;
      while(rest.length>chars){
        let cut=rest.lastIndexOf(" ",chars);
        if(cut<Math.floor(chars*0.55))cut=chars;
        lines.push(rest.slice(0,cut).trimEnd());
        rest=rest.slice(cut).trimStart();
      }
      lines.push(rest);
    }
    return lines;
  }

  function draw(){
    const r=canvas.getBoundingClientRect(),d=Math.max(1,Math.min(2,devicePixelRatio||1));
    const w=Math.max(1,Math.floor((r.width||450)*d)),h=Math.max(1,Math.floor((r.height||450)*d));
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
    const cw=r.width||450,ch=r.height||450;
    ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,cw,ch);
    ctx.fillStyle=state.color;ctx.shadowColor=state.color;ctx.shadowBlur=3;ctx.font="12px monospace";ctx.textBaseline="top";
    const lh=17,max=Math.max(1,Math.floor((ch-12)/lh)),chars=Math.max(30,Math.floor((cw-18)/7.1));
    const terminalLines=[];
    for(const entry of state.history.slice(-120))terminalLines.push(...wrapTerminalText(entry,chars));
    const start=Math.max(0,terminalLines.length-max);
    for(let i=start;i<terminalLines.length;i++)ctx.fillText(terminalLines[i],9,7+(i-start)*lh);
    ctx.shadowBlur=0;
  }
  function switchTab(i){
    i=Number(i);if(![0,1,2].includes(i))return;
    qsa(".tab").forEach((b,n)=>{b.classList.toggle("active",n===i);b.setAttribute("aria-selected",String(n===i));});
    qsa(".panel").forEach((p,n)=>p.classList.toggle("visible",n===i));
    if(i===1){updateLineNumbers();saveSessionDebounced();}
    if(i===0)drawLater();
  }
  function theme(v){
    state.theme=v==="amber"?"amber":"green";
    document.documentElement.toggleAttribute("data-theme",state.theme==="amber");
    if(state.theme==="amber")state.color="#ffb000";else state.color="#00ff33";
    const title=sandbox.contentDocument?.getElementById("title");if(title)title.style.color=state.color;
    drawLater();
  }
  function snapshot(label){state.snapshots.push({label,code:editor.value});if(state.snapshots.length>40)state.snapshots.shift();}
  function undo(){
    const x=state.snapshots.pop();if(!x){log("ANABEL: não há estado anterior.");return;}
    editor.value=x.code;log("ANABEL: estado restaurado → "+x.label);switchTab(1);
  }
  function revokeSandbox(){
    const oldUrl=state.sandboxUrl;
    state.sandboxUrl="";
    if(oldUrl){try{sandbox.src="about:blank";}catch(e){}try{URL.revokeObjectURL(oldUrl);}catch(e){}}
    runtimeKind="";pythonRuntimeReady=false;pendingPythonCode=null;
  }
  function detectLanguage(code){
    const s=String(code||"").trimStart();
    if(/^(<!doctype html|<html\b|<body\b|<canvas\b|<style\b|<script\b)/i.test(s)||/<(?:div|main|section|head|title)\b/i.test(s))return "html";
    if(/^(from\s+[A-Za-z_][\w.]*\s+import|import\s+[A-Za-z_][\w.]*)/m.test(s)||/^(def|class)\s+[A-Za-z_]\w*\s*\(?/m.test(s)||/\bprint\s*\(/.test(s)||/if\s+__name__\s*==\s*["']__main__["']/.test(s))return "python";
    if(/\b(const|let|var)\s+[A-Za-z_$][\w$]*\s*=|=>|document\.\w+|console\.log\s*\(/.test(s))return "javascript";
    return state.language==="python"?"python":"javascript";
  }
  function setLanguage(lang){
    state.language=lang||"auto";
    const shown=state.language==="auto"?detectLanguage(editor.value):state.language;
    if(lastShownLanguage&&lastShownLanguage!==shown)autocomplete.classList.remove("show");
    lastShownLanguage=shown;
    if(editorMeta)editorMeta.textContent="LINGUAGEM: "+String(shown).toUpperCase()+" · AUTOCOMPLETE: CTRL+ESPAÇO / TAB";
  }
  function updateLineNumbers(){
    if(!lineNumbers)return;
    const count=Math.max(1,(editor.value.match(/\n/g)||[]).length+1);
    lineNumbers.textContent=Array.from({length:count},(_,i)=>String(i+1)).join("\n");
    lineNumbers.scrollTop=editor.scrollTop;
  }
  function saveSession(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify({code:editor.value,language:state.language,theme:state.theme,savedAt:Date.now()}));}catch(e){}
  }
  function saveSessionDebounced(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{saveTimer=null;saveSession();},250);
  }
  function restoreSession(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw)return false;
      const saved=JSON.parse(raw);
      if(!saved||typeof saved.code!=="string"||!saved.code.trim())return false;
      editor.value=saved.code;
      if(saved.language)state.language=saved.language;
      if(saved.theme)theme(saved.theme);
      setLanguage(state.language||"auto");
      updateLineNumbers();
      log("ANABEL: Bem-vindo de volta! Recuperei o código da última sessão.");
      status.textContent="Sessão anterior recuperada automaticamente.";
      return true;
    }catch(e){return false;}
  }

  function pythonRuntimeHTML(localBase=""){
    const pyodideBases=[localBase,"https://cdn.jsdelivr.net/pyodide/v314.0.7/full/","https://cdn.jsdelivr.net/pyodide/v0.29.5/full/"].filter((x,i,a)=>x&&!a.slice(0,i).includes(x));
    const boot=[
      "(async()=>{",
      'const state=document.getElementById("state"),out=document.getElementById("out"),NL=String.fromCharCode(10),bases='+JSON.stringify(pyodideBases)+';',
      'let pyodide=null,lastError=null;',
      'function send(type,data){parent.postMessage(Object.assign({source:"dev-anabel-python",type:type},data||{}),"*")}',
      'function emit(kind,value){const s=String(value==null?"":value);if(s)out.textContent+=s;send("output",{kind:kind,text:s})}',
      'function loadScript(src){return new Promise(function(resolve,reject){const s=document.createElement("script");s.src=src;s.onload=function(){resolve(s)};s.onerror=function(){reject(new Error("Falha ao carregar "+src))};document.head.appendChild(s)})}',
      'async function bootBase(base){state.textContent="PYTHON: tentando "+base+"…";let script=null;try{script=await loadScript(base+"pyodide.js");if(typeof window.loadPyodide!=="function")throw new Error("loadPyodide indisponível");pyodide=await window.loadPyodide({indexURL:base});return true}catch(err){lastError=err;if(script&&script.parentNode)script.parentNode.removeChild(script);try{delete window.loadPyodide}catch(e){}pyodide=null;return false}}',
      'try{let loaded=false;for(const base of bases){loaded=await bootBase(base);if(loaded){state.textContent="PYTHON: ambiente pronto";send("ready",{version:String(pyodide.runPython("import sys;sys.version"))});break}}if(!loaded)throw lastError||new Error("Nenhuma distribuição Pyodide pôde ser carregada")}catch(err){state.textContent="PYTHON: falha ao inicializar";send("error",{error:String(err)})}',
      'window.addEventListener("message",async function(e){const d=e.data||{};if(d.source!=="dev-anabel-python"||!pyodide||d.action!=="run")return;state.textContent="PYTHON: executando…";try{await pyodide.loadPackagesFromImports(String(d.code||""));const result=await pyodide.runPythonAsync(String(d.code||""));if(result!==undefined&&result!==null)emit("result",String(result)+NL);send("done",{ok:true})}catch(err){emit("stderr",String(err)+NL);send("done",{ok:false,error:String(err)})}state.textContent="PYTHON: pronto"});',
      '})()'
    ].join("");
    const closeScript="<"+"/script>";
    return '<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Runtime</title><style>body{margin:0;background:#000;color:#00ff33;font:12px monospace;padding:10px}#state{border:1px solid #333;padding:7px;margin-bottom:8px}pre{white-space:pre-wrap;margin:0;border:1px solid #333;background:#050505;padding:10px;min-height:220px;overflow:auto}</style></head><body><div id="state">PYTHON: carregando…</div><pre id="out"></pre><script>'+boot+closeScript+'</body></html>';
  }

  function postPython(action,code){
    if(!sandbox.contentWindow){log("ANABEL: ambiente Python ainda não está disponível.");return false;}
    sandbox.contentWindow.postMessage({source:"dev-anabel-python",action,code},"*");return true;
  }
  function runPython(code){
    const source=String(code||"");
    if(!source.trim()){log("ANABEL: não há código Python para executar.");return false;}
    switchTab(2);status.textContent=pythonRuntimeReady?"Python pronto.":"Carregando ambiente Python…";
    if(runtimeKind!=="python"){
      revokeSandbox();
      runtimeKind="python";pythonRuntimeReady=false;pendingPythonCode=source;
      state.sandboxUrl=URL.createObjectURL(new Blob([pythonRuntimeHTML(new URL("./pyodide/",location.href).href)],{type:"text/html;charset=utf-8"}));
      sandbox.src=state.sandboxUrl;
      log("ANABEL: conectando ao ambiente Python (Pyodide/CPython WebAssembly)…");
      return true;
    }
    if(pythonRuntimeReady){pendingPythonCode=null;postPython("run",source);log("ANABEL: Python enviado ao ambiente persistente.");}
    else{pendingPythonCode=source;log("ANABEL: Python aguardando o ambiente ficar pronto.");}
    return true;
  }
  function webRuntimeHTML(code,language){
    const source=String(code||"");
    const closeSeq="<"+"/script";
    const closeScript=closeSeq+">";
    const safeSource=source.split(closeSeq).join("<\\/script").split("</SCRIPT").join("<\\/SCRIPT");
    const bootstrap='<script>(()=>{addEventListener("error",e=>parent.postMessage({source:"dev-anabel-runtime",type:"error",error:String(e.message||"erro no runtime")},"*"));addEventListener("unhandledrejection",e=>parent.postMessage({source:"dev-anabel-runtime",type:"error",error:String(e.reason||"Promise rejeitada")},"*"));const oldLog=console.log.bind(console);console.log=(...a)=>{oldLog(...a);parent.postMessage({source:"dev-anabel-runtime",type:"log",text:a.map(String).join(" ")},"*")};})()'+closeScript;
    if(language==="css"){
      return '<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+bootstrap+'<style>'+source.replaceAll("</style","<\\/style").replaceAll("</STYLE","<\\/STYLE")+'</style></head><body><div id="app"></div></body></html>';
    }
    const module=/^\\s*(?:import|export)\\b/m.test(source);
    const scriptTag=module?'<script type="module">':'<script>';
    return '<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+bootstrap+'</head><body><div id="app"></div>'+scriptTag+safeSource+closeScript+'</body></html>';
  }
  function run(code){
    if(!String(code||"").trim()){log("ANABEL: não há código para executar.");return false;}
    const language=state.language==="auto"?detectLanguage(code):state.language;
    if(language==="python")return runPython(code);
    revokeSandbox();
    runtimeKind="html";
    const source=String(code);
    const themed=state.theme==="amber"?source.replaceAll("#00ff33","#ffb000").replaceAll("#0f3","#ffb000"):source;
    const full=/<!doctype html|<html\\b/i.test(themed.trim())?themed:webRuntimeHTML(themed,language);
    state.sandboxUrl=URL.createObjectURL(new Blob([full],{type:"text/html;charset=utf-8"}));
    sandbox.src=state.sandboxUrl;log("ANABEL: código "+(language==="javascript"?"JavaScript":"web")+" executado no Sandbox isolado.");switchTab(2);status.textContent="Sandbox web ativo.";return true;
  }
  function post(command){
    if(!sandbox.contentWindow){log("ANABEL: Sandbox ainda não está pronto.");return;}
    sandbox.contentWindow.postMessage({source:"dev-anabel",command},"*");
  }
  function renderSources(){

  function isCodeUrl(url){
    return /\.(?:js|mjs|css|py|ts|tsx|jsx|json|html|htm|xml|svg|c|cpp|h|hpp|cs)(?:[?#].*)?$/i.test(String(url||""));

  function decodeHtmlText(text){
    const box=document.createElement("textarea");
    box.innerHTML=String(text||"");
    return box.value;
  }
  function extractCodeBlocks(text,url=""){
    const raw=String(text||"");
    const blocks=[];
    const fenced=/```([^\n`]*)\n([\s\S]*?)```/g;
    let m;
    while((m=fenced.exec(raw))){
      const language=(m[1]||"").trim().toLowerCase();
      const code=decodeHtmlText(m[2]).trim();
      if(code.length>=12)blocks.push({language,code});
    }
    const html=/<pre[^>]*>\s*<code[^>]*>([\s\S]*?)<\/code>\s*<\/pre>/gi;
    while((m=html.exec(raw))){
      const code=decodeHtmlText(m[1].replace(/<[^>]+>/g,"")).trim();
      if(code.length>=12)blocks.push({language:"",code});
    }
    if(!blocks.length&&isCodeUrl(url)&&raw.trim().length>=30)blocks.push({language:"",code:raw.trim()});
    return blocks.filter((x,i,a)=>a.findIndex(y=>y.code===x.code)===i).sort((x,y)=>y.code.length-x.code.length).slice(0,8);
  }
  function guessCodeLanguage(block,url="",hint=""){
    const h=norm(hint),ext=String(url||"").match(/\.([a-z0-9]+)(?:[?#].*)?$/i)?.[1]?.toLowerCase();
    if(h==="py"||h==="python"||ext==="py")return "python";
    if(["ts","tsx"].includes(ext)||/typescript/.test(h))return "typescript";
    if(["js","mjs","jsx"].includes(ext)||/javascript|js\b/.test(h))return "javascript";
    if(ext==="css"||h==="css")return "css";
    if(ext==="json"||h==="json")return "json";
    if(["html","htm","xml","svg"].includes(ext)||/html|xml|svg/.test(h))return "html";
    const s=String(block||"");
    if(/(^|\n)\s*(from\s+\w+\s+import|import\s+\w+|def\s+\w+|print\s*\()/m.test(s))return "python";
    if(/\b(const|let|var)\b|=>|document\.\w+|console\.log\s*\(/.test(s))return "javascript";
    if(/<(!doctype|html|body|div|canvas|script|style)\b/i.test(s))return "html";
    if(/^[^{]+\{[^}]*:[^}]*\}/m.test(s))return "css";
    return "javascript";
  }

  async function readWebPage(url,opts={}){
    const original=String(url||"").trim();
    if(!original)throw new Error("URL vazia");
    const timeout=opts.timeout||15000;
    const targets=opts.codeFirst?[original,"https://r.jina.ai/"+original]:["https://r.jina.ai/"+original,original];
    let lastErr=null;
    for(const target of [...new Set(targets)]){
      try{
        const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
        const r=await fetch(target,{signal:controller.signal,redirect:"follow"});
        clearTimeout(timer);
        if(!r.ok)throw new Error("HTTP "+r.status);
        const text=await r.text();
        if(text.trim())return {url:original,text,reader:target.startsWith("https://r.jina.ai/"),resolved:r.url||target};
      }catch(e){lastErr=e;}
    }
    throw lastErr||new Error("Não foi possível ler a página");
  }
  async function readGithubRepoCode(url){
    const m=String(url||"").match(/^https?:\/\/github\.com\/([^/]+)\/([^/#?]+)\/?(?:[?#].*)?$/i);
    if(!m)return [];
    const owner=m[1],repo=m[2];
    try{
      const tree=await httpJson("https://api.github.com/repos/"+encodeURIComponent(owner)+"/"+encodeURIComponent(repo)+"/git/trees/HEAD?recursive=1",12000);
      const allow=/\.(?:js|mjs|ts|tsx|jsx|py|html|htm|css|json|java|c|cpp|h|hpp|cs|go|rs|php|rb)$/i;
      const files=(tree.tree||[]).filter(x=>x.type==="blob"&&allow.test(x.path||"")&&!/(node_modules|dist|build|vendor|coverage|\.min\.)/i.test(x.path||"")).sort((x,y)=>x.path.length-y.path.length).slice(0,6);
      const out=[];
      for(const file of files){
        try{
          const raw="https://raw.githubusercontent.com/"+owner+"/"+repo+"/HEAD/"+file.path.split("/").map(encodeURIComponent).join("/");
          const data=await readWebPage(raw,{codeFirst:true,timeout:12000});
          const block=extractCodeBlocks(data.text,raw)[0];
          const code=block?.code||data.text;
          if(code&&code.length>=30)out.push({title:owner+"/"+repo+" / "+file.path,url:raw,code,language:guessCodeLanguage(code,raw,block?.language)});
        }catch(e){}
      }
      return out;
    }catch(e){return [];}
  }
  async function loadUrl(url){

      if(blocks.length){
        const block=blocks[0];
        const lang=guessCodeLanguage(block.code,target,block.language);
        deliverCode(block.code,lang,target,data.resolved||target);

  function acceptAutocomplete(index){
    if(!acItems.length)return false;
    const item=acItems[Math.max(0,Math.min(acItems.length-1,index??acIndex))];
    const ctx=currentPythonContext();
    const tokenLen=ctx.token.length;
    let start=ctx.pos-tokenLen;
    if(ctx.dot)start=ctx.lineStart+ctx.line.lastIndexOf(".")+1;
    editor.setRangeText(item.label,start,ctx.pos,"end");
    setLanguage("python");autocomplete.classList.remove("show");
    status.textContent=PY_SIGNATURES[item.label]||"Sugestão aplicada: "+item.label;

  function pythonIndent(e){
    if(detectLanguage(editor.value)!=="python")return false;
    if(e.key==="Tab"){
      e.preventDefault();
      if(autocomplete.classList.contains("show")&&acItems.length)return acceptAutocomplete();
      const a=editor.selectionStart,b=editor.selectionEnd,selected=editor.value.slice(a,b);
      const currentLine=editor.value.slice(0,a).split("\n").pop()||"";
      const indent=(currentLine.match(/^\s*/)||[""])[0];
      if(a!==b)editor.setRangeText(selected.split("\n").map(x=>indent+"    "+x).join("\n"),a,b,"select");
      else editor.setRangeText("    ",a,b,"end");
      renderAutocomplete(false);return true;
    }
    if(e.key==="Enter"){
      if(autocomplete.classList.contains("show")&&acItems.length){e.preventDefault();return acceptAutocomplete();}
      e.preventDefault();
      const pos=editor.selectionStart,before=editor.value.slice(0,pos),line=before.slice(before.lastIndexOf("\n")+1);
      const base=(line.match(/^\s*/)||[""])[0];
      const extra=/:\s*$/.test(line)?"    ":"";
      let text="\n"+base+extra;
      editor.setRangeText(text,pos,editor.selectionEnd,"end");
      const newLine=editor.value.slice(0,editor.selectionStart).split("\n").pop()||"";
      if(/^\s*(elif|else|except|finally)\b/.test(newLine)&&/^(\s*)(elif|else|except|finally)\b/.test(newLine)){
        const currentIndent=(newLine.match(/^\s*/)||[""])[0];
        if(currentIndent.length>=4){
          const p=editor.selectionStart-currentIndent.length;
          editor.setRangeText("",p,p+4,"end");
        }
      }
      renderAutocomplete(false);return true;
    }
    return false;
  }

  function cleanSearchTopic(query){
    let q=String(query||"").replace(/\s+/g," ").trim();
    q=q.replace(/^(anabel[\s,:-]*)/i,"");
    q=q.replace(/\b(?:procure|encontre|busque|ache|pesquise|pesquisar|buscar|busca)\b/gi," ");
    q=q.replace(/\b(?:me\s+)?(?:de|dê|traga|entregue|entregar|mostre|mostre-me)\b/gi," ");
    q=q.replace(/\b(?:um|uma|o|a)\s+(?:codigo|código|script|exemplo)\b/gi," ");
    q=q.replace(/\s+/g," ").trim();
    return q||String(query||"").trim();
  }

  function inferSearchLanguage(query){
    const n=norm(query);
    if(/\bpython\b|\bpyodide\b|\bdjango\b|\bflask\b|\bpandas\b|\bnumpy\b/.test(n))return "python";
    if(/\btypescript\b|\btsx\b/.test(n))return "typescript";
    if(/\bjavascript\b|\bjs\b|\bnode(?:\.js)?\b|\bcanvas\b|\bdom\b/.test(n))return "javascript";
    if(/\bcss\b|\bstylesheet\b/.test(n))return "css";
    if(/\bhtml\b|\bweb\b|\bfrontend\b/.test(n))return "html";
    return "";
  }

  function buildSearchPlan(query){

    const language=inferSearchLanguage(topic);
    const languageHint=language?language+" ":"";
    const terms=[topic];
    if(language)terms.push(topic+" example implementation "+language);
    else terms.push(topic+" example implementation");
    terms.push(topic+" github repository");
    terms.push(topic+" documentation "+languageHint+"guide".replace(/\s+/g," ").trim());
    return {
      topic,
      language,
      terms:[...new Set(terms.map(x=>x.replace(/\s+/g," ").trim()))].filter(Boolean).slice(0,4),
      sources:["GITHUB","STACKOVERFLOW","DOCS"]
    };
  }

  function codeQualityScore(code,language){
    const s=String(code||"");
    const m=mask(s);
    let score=Math.min(25,Math.floor(s.length/80));
    const reasons=[];
    if(s.length>=160){score+=8;reasons.push("completude");}
    if(/function\s+\w+|=>|\bdef\s+\w+/.test(m)){score+=10;reasons.push("estrutura modular");}
    if(/try\s*\{|try:|catch\s*\(|response\.ok|throw\s+/.test(m)){score+=8;reasons.push("tratamento de erros");}
    if(/addEventListener|requestAnimationFrame|async\s+|await\s+/.test(m)){score+=6;reasons.push("eventos/fluxo assíncrono");}
    if(/\bconst\b|\blet\b|===|!==/.test(m)){score+=5;reasons.push("sintaxe moderna");}
    if(/aria-|textContent\s*=|createElement\(/.test(m)){score+=4;reasons.push("integração DOM");}
    if(/getContext\(|canvas|fillRect|drawImage/.test(m)){score+=4;reasons.push("Canvas");}
    if(/\/\*|\/\/|#\s|'''|"""/.test(s)){score+=3;reasons.push("documentação");}
    if(/eval\(|new\s+Function\(|document\.write\(/.test(m)){score-=12;reasons.push("padrão inseguro/legado");}
    if(/\bvar\b|console\.log\s*\(/.test(m)){score-=3;reasons.push("debug/legado");}
    if(language==="python"&&/import\s+(requests|numpy|pandas|pygame)/.test(m)){score+=3;reasons.push("biblioteca Python");}
    return {score,reasons:[...new Set(reasons)]};
  }

  function sourceWeight(kind,url=""){
    const k=String(kind||"").toUpperCase(),u=String(url||"").toLowerCase();
    if(/developer\.mozilla\.org|docs\.python\.org/.test(u))return 10;
    if(k==="GITHUB")return 7;
    if(k==="STACKOVERFLOW")return 5;
    if(k==="DOCS")return 8;
    return 0;
  }

  function candidateScore(candidate,query,plan){
    const code=String(candidate.code||"");
    const language=candidate.language||guessCodeLanguage(code,candidate.url);
    const base=codeQualityScore(code,language);
    const hay=norm([query,candidate.title,candidate.note,candidate.url].join(" "));
    const tokens=[...new Set(norm(plan.topic).split(/\s+/).filter(x=>x.length>=3))].slice(0,18);
    const matched=tokens.filter(x=>hay.includes(x)).length;
    const codeMatched=tokens.filter(x=>norm(code).includes(x)).length;
    let score=base.score+sourceWeight(candidate.sourceKind||candidate.kind,candidate.url);
    score+=Math.min(18,matched*3);
    score+=Math.min(12,codeMatched*2);
    if(plan.language&&language===plan.language)score+=8;
    if(code.length>=300)score+=4;
    if(code.length>=800)score+=3;
    if(/README|example|example|tutorial|demo|starter|guide/i.test(String(candidate.title||"")))score+=3;
    if(/TODO|FIXME|throw new Error|raise\s+\w+/.test(code))score+=2;
    if(/eval\(|new\s+Function\(|document\.write\(/.test(mask(code)))score-=10;
    if(/\b(var|print)\b/.test(mask(code))&&language==="javascript")score-=2;
    return {
      score:Math.max(0,Math.min(100,Math.round(score))),
      language,
      reasons:[...new Set([
        ...base.reasons,
        matched?"relevância do termo":"",
        codeMatched?"conteúdo alinhado ao objetivo":"",
        plan.language&&language===plan.language?"linguagem compatível":"",
        sourceWeight(candidate.sourceKind||candidate.kind,candidate.url)>=8?"fonte documental forte":"",
        code.length>=300?"código suficientemente completo":"",
        /eval\(|new\s+Function\(|document\.write\(/.test(mask(code))?"padrão inseguro/legado":""
      ].filter(Boolean))]
    };
  }

  async function autonomousSearch(query,reason="objetivo do usuário"){
    const q=String(query||"").trim();
    if(!q||autonomousBusy||state.autonomous.enabled===false)return false;
    const key=norm(q)+"|"+norm(reason);
    if(state.autonomousLastKey===key&&Date.now()-state.autonomous.lastAt<15000)return false;
    autonomousBusy=true;
    state.autonomousLastKey=key;
    state.autonomous.lastAt=Date.now();
    state.autonomous.lastQuery=q;
    state.autonomous.lastReason=reason;
    state.autonomous.candidateCount=0;
    state.autonomous.selected="";
    state.autonomous.score=0;
    state.autonomous.alternatives=[];
    status.textContent="AGENTE AUTÔNOMO: analisando objetivo…";
    log("ANABEL: INICIANDO MODO AUTÔNOMO.");
    const plan=buildSearchPlan(q);
    state.autonomous.plan=plan;
    log("ANABEL: objetivo normalizado → "+plan.topic);
    log("ANABEL: estratégia → "+plan.terms.join(" | "));
    log("ANABEL: fontes → GitHub + Stack Overflow + Documentação.");
    try{
      const jobs=[];
      for(const term of plan.terms){
        for(const source of plan.sources)jobs.push(Promise.resolve().then(()=>searchSource(term,source)));
      }
      const searchResults=await Promise.allSettled(jobs);
      const refs=[],seen=new Set();
      searchResults.forEach(r=>{
        if(r.status!=="fulfilled")return;
        (r.value||[]).forEach(ref=>{
          if(ref?.url&&!seen.has(ref.url)){
            seen.add(ref.url);
            refs.push(ref);
            addSource(ref);
          }
        });
      });
      log("ANABEL: varredura concluída → "+refs.length+" referências distintas.");
      if(!refs.length){
        status.textContent="Agente: nenhuma referência encontrada.";
        log("ANABEL: nenhuma fonte respondeu com resultados utilizáveis.");
        return false;
      }

      const targets=refs.slice(0,15);
      log("ANABEL: lendo "+targets.length+" referências selecionadas.");
      const pages=await Promise.allSettled(targets.map(async ref=>{
        const out=[];
        if(ref.kind==="GITHUB"){
          try{out.push(...await readGithubRepoCode(ref.url));}catch(e){}
        }
        if(ref.kind!=="GITHUB"){
          try{
            const page=await readWebPage(ref.url,{timeout:14000});
            extractCodeBlocks(page.text,ref.url).forEach((b,i)=>{
              const sourceKind=ref.kind==="DOCS"?"DOCS":ref.kind;
              out.push({
                title:ref.title+(i?" · bloco "+(i+1):""),
                url:ref.url,
                code:b.code,
                language:guessCodeLanguage(b.code,ref.url,b.language),
                sourceKind,
                note:ref.note||""
              });
            });
          }catch(e){}
        }
        return out;
      }));
      const candidates=[];
      pages.forEach(r=>{if(r.status==="fulfilled")candidates.push(...r.value);});
      const unique=[];
      const codeSeen=new Set();
      for(const candidate of candidates){
        const normalized=String(candidate.code||"").trim();
        if(normalized.length<20||codeSeen.has(normalized))continue;
        codeSeen.add(normalized);
        const scored=candidateScore({...candidate,code:normalized},q,plan);
        unique.push({...candidate,code:normalized,language:scored.language,score:scored.score,reasons:scored.reasons});
      }
      unique.sort((a,b)=>b.score-a.score||b.code.length-a.code.length);
      state.autonomous.candidateCount=unique.length;
      state.autonomous.alternatives=unique.slice(1,4).map(x=>({title:x.title,url:x.url,score:x.score,language:x.language}));
      if(!unique.length){
        log("ANABEL: li várias referências, mas não extraí nenhum código utilizável.");
        status.textContent="Agente: nenhum código extraível.";
        return false;
      }

      const best=unique[0];
      state.autonomous.selected=best.title;
      state.autonomous.score=best.score;
      deliverCode(best.code,best.language,best.title,best.url);
      autonomousReport(best,state.autonomous.alternatives.length,refs.length);
      log("ANABEL: comparei "+unique.length+" candidatos de código.");
      log("ANABEL: seleção → "+best.title);
      log("ANABEL: critérios → "+best.reasons.join(", "));
      log("ANABEL: código carregado no editor sem nova confirmação.");
      status.textContent="Agente autônomo concluiu: código selecionado e entregue.";
      return true;
    }catch(e){
      console.error("autonomousSearch:",e);
      log("ANABEL: o loop autônomo encontrou uma falha, mas preservou o editor.");
      status.textContent="Agente: falha controlada na pesquisa.";
      return false;
    }finally{
      autonomousBusy=false;
    }
  }

  function mask(code){
    let out="",mode="code",quote="";
    for(let i=0;i<code.length;i++){
      const c=code[i],n=code[i+1];
      if(mode==="code"){
        if(c==="/"&&n==="/"){out+="  ";mode="line";i++;continue;}
        if(c==="/"&&n==="*"){out+="  ";mode="block";i++;continue;}
        if(c==="\""||c==="'"||c===String.fromCharCode(96)){out+=" ";quote=c;mode="string";continue;}
        out+=c;continue;
      }
      if(mode==="line"){out+=c==="\n"?"\n":" ";if(c==="\n")mode="code";continue;}
      if(mode==="block"){out+=c==="\n"?"\n":" ";if(c==="*"&&n==="/"){out+=" ";i++;mode="code";}continue;}
      out+=c==="\n"?"\n":" ";
      if(c==="\\"){out+=" ";i++;continue;}
      if(c===quote)mode="code";
    }
    return out;
  }

  function refactorVar(code){
    const m=mask(code);let out="",count=0;
    for(let i=0;i<code.length;){
      const prev=i?m[i-1]:" ",next=m[i+3]||" ";
      if(m.slice(i,i+3)==="var"&&/[^A-Za-z0-9_$]/.test(prev)&&/\s/.test(next)){out+="let";i+=3;count++;}
      else{out+=code[i];i++;}
    }
    return {code:out,count};
  }

  function removeLogs(code){
    let count=0;
    const out=code.split("\n").filter(line=>{
      if(/^\s*console\.log\s*\([^;]*\)\s*;?\s*$/.test(line)){count++;return false;}
      return true;
    });
    return {code:out.join("\n"),count};
  }

  function arrows(code){
    let count=0;
    const re=/(?:const\s+([A-Za-z_$][\w$]*)\s*=\s*)?function\s*\(([^)]*)\)\s*\{\s*return\s+([^;{}]+);?\s*\}\s*;?/g;
    const out=code.replace(re,(match,name,args,expr)=>{
      count++;
      const body="("+args.trim()+") => "+expr.trim();
      return name?"const "+name+" = "+body+";":body+";";
    });
    return {code:out,count};
  }

  function buildImprovements(m,result,sourceCode=""){
    const raw=String(sourceCode||"");
    const out=[];
    if(result.varCount)out.push("Substitua var por let/const conforme a necessidade de reatribuição e escopo.");
    if(result.logCount)out.push("Remova console.log de diagnóstico que não seja necessário no código final.");
    if(result.functionCount>result.arrowCount)out.push("Modernize funções simples com retorno direto para Arrow Functions quando isso preservar o comportamento.");
    if(result.fetchCount)out.push("Valide response.ok, trate erros de rede e considere CORS antes de consumir a resposta.");
    if(/\bawait\b/.test(m))out.push("Proteja operações assíncronas com try/catch e trate estados de carregamento/falha.");
    if(/getContext\s*\(\s*["']2d["']\)/.test(raw))out.push("Para jogos e animações Canvas, centralize requestAnimationFrame e considere devicePixelRatio.");
    if(/innerHTML\s*=/.test(m))out.push("Evite inserir HTML dinâmico sem necessidade; prefira textContent para texto simples.");
    if(/addEventListener\s*\(/.test(m))out.push("Centralize listeners repetidos e remova listeners que não tenham mais utilidade.");
    if(/touch|pointer|click/.test(m))out.push("Teste entrada por toque e mouse em diferentes tamanhos de tela.");
    out.push("Mantenha funções pequenas, valide entradas e deixe uma responsabilidade clara em cada etapa.");
    return [...new Set(out)];
  }

  function renderReview({result,sourceCode,correctedCode=sourceCode,mode="análise"}){
    const improvements=buildImprovements(mask(sourceCode),result,sourceCode);
    const issues=[];
    if(result.varCount)issues.push(result.varCount+" ocorrência(s) de var");
    if(result.logCount)issues.push(result.logCount+" console.log");
    if(result.functionCount>result.arrowCount)issues.push("funções simples passíveis de modernização");
    if(result.fetchCount)issues.push("uso de fetch");
    if(/\bawait\b/.test(mask(sourceCode)))issues.push("código assíncrono");
    state.review={issues,improvements,correctedCode};
    if(reviewSummary)reviewSummary.textContent=issues.length?
      "Revisão "+mode+": "+issues.join(" · ")+".":
      "Revisão "+mode+": nenhum problema básico detectado.";
    if(reviewList)reviewList.innerHTML=improvements.map(x=>"<li>"+esc(x)+"</li>").join("");
    if(correctedOutput)correctedOutput.value=correctedCode||sourceCode;
  }

  function analyzePython(code){
    const src=String(code||""),issues=[],suggestions=[];
    const lines=src.split("\n");
    let balance=0;
    for(const ch of src){if("([{".includes(ch))balance++;else if(")]}".includes(ch))balance--;}
    if(balance!==0)issues.push("delimitadores possivelmente desbalanceados");
    lines.forEach((line,i)=>{
      if(/^\s*(def|class|if|elif|else|for|while|try|except|finally|with|match|case)\b/.test(line)&&/:\s*(#.*)?$/.test(line)===false&&!/\b(else|try|finally)\b/.test(line))suggestions.push("linha "+(i+1)+": verifique os dois-pontos no fim do bloco");
      if(/^\s*(if|elif)\b.*(?<![=!<>])=(?!=)/.test(line))issues.push("linha "+(i+1)+": atribuição simples dentro de condição; talvez você queira == ou outra expressão");
      if(/^\s*print\s*\(.*\)\s*$/.test(line)&&/["']/.test(line)===false)suggestions.push("linha "+(i+1)+": confirme se o valor impresso é o esperado");
    });
    if(/\bexcept\s*:\s*$/.test(src))suggestions.push("Prefira exceções específicas quando isso não reduzir a clareza.");
    if(/\binput\s*\(/.test(src))suggestions.push("input() pode exigir uma interface própria no navegador; use widgets ou parâmetros para experiências web.");
    if(/\bglobal\b/.test(src))suggestions.push("Evite global quando uma função, classe ou retorno explícito resolver o mesmo problema.");
    return {issues:[...new Set(issues)],suggestions:[...new Set(suggestions)]};
  }

  // BASE DE CONHECIMENTO DE ERROS — Sintoma → Cura
  const BUG_DATABASE=[
    {
      id:"VAR_OBSOLETE",
      label:"Uso de 'var' (Obsoleto)",
      pattern:/\bvar\b/,
      symptom:code=>/\bvar\b/.test(mask(code)),
      fix:code=>refactorVar(code).code,
      tip:"Substituído 'var' por 'let' para reduzir problemas de escopo. Use 'const' quando não houver reatribuição."
    },
    {
      id:"CONSOLE_LOG_DEBUG",
      label:"Logs de Debug (Poluição)",
      pattern:/console\.log\s*\(/,
      symptom:code=>/console\.log\s*\(/.test(mask(code)),
      fix:code=>removeLogs(code).code,
      tip:"Removidos console.log usados como diagnóstico; preserve logs somente quando fizerem parte da funcionalidade."
    },
    {
      id:"ASYNC_WITHOUT_TRY",
      label:"Async sem Try/Catch",
      pattern:/\bawait\b/,
      symptom:code=>/\bawait\b/.test(mask(code))&&!/\btry\s*\{/.test(mask(code)),
      fix:code=>{
        const src=String(code||"");
        if(!/\basync\b/.test(mask(src)))return src;
        const re=/^(\s*)(await\s+[^;\n]+;?)\s*$/gm;
        let count=0;
        const fixed=src.replace(re,(all,indent,statement)=>{
          count++;
          const clean=statement.trimEnd();
          return indent+"try {\n"+indent+"  "+clean+"\n"+indent+"} catch (err) {\n"+indent+'  console.error("Erro capturado pela Anabel:", err);\n'+indent+"}";
        });
        return count?fixed:src;
      },
      tip:"Operações await simples foram protegidas com try/catch. Expressões await complexas exigem revisão contextual."
    },
    {
      id:"FUNCTION_MODERNIZATION",
      label:"Função Tradicional (Sugerida Arrow)",
      pattern:/function\s*\(([^)]*)\)\s*\{\s*return\s+/,
      symptom:code=>/function\s*\(.*\)\s*\{\s*return\s+.*\}/s.test(mask(code)),
      fix:code=>arrows(code).code,
      tip:"Função simples com retorno direto modernizada para Arrow Function."
    },
    {
      id:"CANVAS_OPTIMIZATION",
      label:"Canvas sem devicePixelRatio",
      pattern:/getContext\s*\(\s*['"]2d['"]\s*\)/,
      symptom:code=>/getContext\s*\(\s*['"]2d['"]\s*\)/.test(mask(code))&&!/\bdevicePixelRatio\b/.test(mask(code)),
      fix:code=>{
        const src=String(code||"");
        if(/\bdevicePixelRatio\b/.test(mask(src)))return src;
        const re=/^(\s*)(const|let|var)\s+ctx\s*=\s*canvas\.getContext\s*\(\s*(['"])2d\3\s*\)\s*;?\s*$/m;
        if(!re.test(src))return src;
        return src.replace(re,(all,indent,decl)=>{
          return indent+"const dpr = window.devicePixelRatio || 1;\n"+
            indent+"const rect = canvas.getBoundingClientRect();\n"+
            indent+"if (rect.width > 0 && rect.height > 0) {\n"+
            indent+"  canvas.width = Math.max(1, Math.round(rect.width * dpr));\n"+
            indent+"  canvas.height = Math.max(1, Math.round(rect.height * dpr));\n"+
            indent+"}\n"+
            indent+decl+" ctx = canvas.getContext(\"2d\");\n"+
            indent+"ctx.setTransform(dpr, 0, 0, dpr, 0, 0);";
        });
      },
      tip:"Canvas ajustado para devicePixelRatio, melhorando a nitidez em telas de alta densidade."
    }
  ];

  async function analyze(){
    const code=editor.value;
    if(!code.trim()){log("ANABEL: editor vazio.");return null;}
    // A IA remota atua como copiloto da análise: ela revisa o código e orienta a Anabel,
    // enquanto as regras locais continuam responsáveis pelas correções determinísticas.
    try{
      const aiPrompt="Atue como copiloto técnico da Anabel. Analise o código abaixo em português do Brasil. Identifique bugs, riscos, problemas de arquitetura, segurança, desempenho e melhorias práticas. Não reescreva o arquivo inteiro; entregue uma revisão objetiva em tópicos e priorize problemas concretos.\n\nCódigo:\n"+code.slice(0,12000);
      const aiUsed=await callRemoteAssistant(aiPrompt);
      log(aiUsed?"ANABEL: IA entrou como copiloto da análise; as correções locais continuam disponíveis.":"ANABEL: nenhum copiloto de IA respondeu; mantendo diagnóstico local.");
    }catch(e){
      log("ANABEL: copiloto de IA indisponível nesta análise; mantendo diagnóstico local.");
    }
    if((state.language==="python"||detectLanguage(code)==="python")){
      const py=analyzePython(code);

      py.suggestions.forEach(x=>log("PYTHON DICA: "+x));
      const base={varCount:0,logCount:0,functionCount:0,arrowCount:0,fetchCount:0,python:true,pythonIssues:py.issues,pythonSuggestions:py.suggestions};
      state.review={issues:py.issues,improvements:[...py.suggestions,"Use Ctrl+Espaço para completar palavras, built-ins, módulos e símbolos do próprio arquivo."],correctedCode:code};
      renderReview({result:base,sourceCode:code,correctedCode:code,mode:"análise Python"});
      state.pendingAction=null;
      return base;
    }
    const m=mask(code);
    const result={
      varCount:(m.match(/\bvar\b/g)||[]).length,
      logCount:(m.match(/\bconsole\.log\s*\(/g)||[]).length,
      functionCount:(m.match(/\bfunction\b/g)||[]).length,
      arrowCount:(m.match(/=>/g)||[]).length,
      fetchCount:(m.match(/\bfetch\s*\(/g)||[]).length
    };
    log("ANABEL: análise concluída.");
    log("ANÁLISE: var="+result.varCount+" · console.log="+result.logCount+" · function="+result.functionCount+" · arrow="+result.arrowCount+" · fetch="+result.fetchCount);
    if(result.fetchCount)log("DICA: confira response.ok, tratamento de erros e CORS.");
    if(/\bawait\b/.test(m))log("DICA: código assíncrono encontrado; considere try/catch.");
    if(result.varCount)log("PERGUNTA DE ESCOPO: esta variável precisa existir fora do bloco onde foi criada?");
    if(result.fetchCount)log("PERGUNTA DE ASSINCRONISMO: o que deve acontecer quando a rede falhar ou responder devagar?");
    if(/\bArray\b|\bObject\b|\bMap\b|\bSet\b/.test(m))log("PERGUNTA DE ESTRUTURA: você precisa preservar ordem, buscar por chave ou impedir duplicidades?");
    renderReview({result,sourceCode:code,correctedCode:code,mode:"análise"});
    state.pendingAction=(result.varCount||result.logCount||result.functionCount>result.arrowCount)?{type:"refactor"}:null;
    if(state.pendingAction)log("ANABEL: existem correções automáticas disponíveis. Use /corrigir ou responda sim para aplicar a refatoração segura.");
    if(!result.varCount&&!result.logCount&&!result.fetchCount)log("DICA: nenhum dos padrões básicos conhecidos foi encontrado.");
    log("ANABEL: ideias de melhoria foram colocadas no painel lateral.");
    return result;
  }

  async function refactor(){
    if(!editor.value.trim()){log("ANABEL: editor vazio.");return null;}
    snapshot("antes da refatoração");
    let code=editor.value;
    const a=refactorVar(code);code=a.code;
    const b=removeLogs(code);code=b.code;
    const c=arrows(code);code=c.code;
    editor.value=code;
    log("ANABEL: refatoração aplicada → var→let: "+a.count+" · console.log removidos: "+b.count+" · arrow: "+c.count);
    if(a.count){addSource({kind:"REF",title:"MDN — let",url:"https://developer.mozilla.org/docs/Web/JavaScript/Reference/Statements/let",note:"Justificativa para let."});log("DICA: use const quando o valor não for reatribuído.");}
    if(b.count)addSource({kind:"REF",title:"MDN — console.log()",url:"https://developer.mozilla.org/docs/Web/API/console/log_static",note:"Referência da Console API."});
    if(c.count)addSource({kind:"REF",title:"MDN — Arrow functions",url:"https://developer.mozilla.org/docs/Web/JavaScript/Reference/Functions/Arrow_functions",note:"A Anabel transforma apenas funções simples com retorno direto."});
    const after=await analyze();
    renderReview({result:after,sourceCode:code,correctedCode:code,mode:"correção"});
    correctedOutput.value=code;
    log("ANABEL: código corrigido foi colocado no Editor e no painel “Código corrigido”.");
    log("ANABEL: veja também as ideias de melhoria no painel “Ideias de melhoria”.");
    switchTab(1);
    return {varCount:a.count,logCount:b.count,arrowCount:c.count,code};
  }

  function runDiagnostic(code){
    const source=String(code||"");
    return BUG_DATABASE.filter(bug=>{
      try{return bug.pattern.test(source)&&bug.symptom(source);}
      catch(e){return false;}
    });
  }

  async function autoFixSystem(){
    const originalCode=String(editor.value||"");
    if(!originalCode.trim()){
      log("ANABEL: editor vazio. Nada para corrigir.");
      status.textContent="Auto-correção: editor vazio.";
      return {changed:false,issues:[],passes:0,code:originalCode};
    }

    snapshot("antes do auto-conserto");
    log("ANABEL: INICIANDO MOTOR DE DIAGNÓSTICO E AUTO-CORREÇÃO.");
    let fixedCode=originalCode;
    const applied=[];
    const seenStates=new Set();
    const MAX_PASSES=8;

    for(let pass=1;pass<=MAX_PASSES;pass++){
      const stateKey=fixedCode;
      if(seenStates.has(stateKey))break;
      seenStates.add(stateKey);
      const issues=runDiagnostic(fixedCode);
      if(!issues.length)break;

      log("ANABEL: passagem "+pass+" → "+issues.length+" sintoma(s) conhecido(s).");
      let changed=false;

      for(let index=0;index<issues.length;index++){
        const bug=issues[index];
        log("["+(applied.length+1)+"] Consertando "+bug.label+"…");
        const before=fixedCode;
        try{
          fixedCode=String(bug.fix(fixedCode)||fixedCode);
        }catch(e){
          fixedCode=before;
          log("ANABEL: correção "+bug.id+" falhou com segurança → "+String(e.message||e));
        }
        if(fixedCode!==before){
          changed=true;
          applied.push({id:bug.id,label:bug.label,tip:bug.tip});
          log("ANABEL: ✓ "+bug.id+" aplicado.");
        }else{
          log("ANABEL: ↳ "+bug.id+" não alterou o código; mantido para revisão contextual.");
        }
      }

      if(!changed)break;
    }

    const remaining=runDiagnostic(fixedCode);
    editor.value=fixedCode;
    correctedOutput.value=fixedCode;
    state.review={
      issues:remaining.map(x=>x.label),
      improvements:[...new Map(applied.map(x=>[x.id,x.tip])).values()],
      correctedCode:fixedCode
    };

    if(reviewSummary){
      reviewSummary.textContent=applied.length
        ? "SISTEMA: "+applied.length+" correção(ões) automática(s) aplicada(s) com sucesso."
        : "SISTEMA: nenhum conserto automático seguro foi aplicado.";
    }
    if(reviewList){
      const items=applied.map(x=>x.tip);
      if(remaining.length)items.push("Revisão manual necessária: "+remaining.map(x=>x.label).join(" · ")+".");
      reviewList.innerHTML=[...new Set(items)].map(x=>"<li>"+esc(x)+"</li>").join("");
    }

    setLanguage(state.language==="auto"?"auto":state.language);
    switchTab(1);

    if(applied.length){
      log("ANABEL: ciclo concluído → "+applied.length+" correção(ões) aplicada(s).");
      applied.forEach((x,i)=>log("AUTO-FIX "+(i+1)+" → "+x.label));
    }else{
      log("ANABEL: nenhum defeito conhecido pôde ser corrigido automaticamente com segurança.");
    }
    if(remaining.length)log("ANABEL: ainda há "+remaining.length+" sintoma(s) para revisão contextual.");
    status.textContent=remaining.length
      ? "Auto-correção concluída · revisão manual necessária."
      : "Auto-correção concluída · diagnóstico limpo.";

    return {changed:fixedCode!==originalCode,issues:remaining,passes:seenStates.size,applied,code:fixedCode};
  }

  function fixCode(){

  async function translateSimple(text){
    const original=String(text||"");
    try{
      const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(original.slice(0,480))+"&langpair=en|pt-BR";
      const data=await httpJson(url,8000);
      const translated=data?.responseData?.translatedText;
      if(translated)return translated;
    }catch(e){}
    return original
      .replace(/\bThis function is a reusable block of code\.?/gi,"Esta função é um bloco reutilizável de código.")
      .replace(/\bThis\b/gi,"Esta")
      .replace(/\bthat\b/gi,"que")
      .replace(/\bfunction\b/gi,"função")
      .replace(/\breusable\b/gi,"reutilizável")
      .replace(/\bblock of code\b/gi,"bloco de código")
      .replace(/\bcode\b/gi,"código")
      .replace(/\bprogramming\b/gi,"programação")
      .replace(/\bgame\b/gi,"jogo")
      .replace(/\bstrategy\b/gi,"estratégia")
      .replace(/\blibrary\b/gi,"biblioteca")
      .replace(/\bdata\b/gi,"dados")
      .replace(/\bweb\b/gi,"web");
  }

  async function callOllamaAssistant(query){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),45000);
    try{
      console.log("ANABEL OLLAMA: tentando", OLLAMA_ENDPOINT, "modelo", OLLAMA_MODEL);
      status.textContent="IA LOCAL: conectando ao Ollama ("+OLLAMA_MODEL+")…";
      const prompt="Você é a IA principal da Dev_Anabel. Responda em português do Brasil, com precisão técnica, de forma prática e direta. Se o usuário pedir código, entregue código funcional e explique os pontos críticos.\\n\\nPedido do usuário:\\n"+String(query).slice(0,12000);
      const response=await fetch(OLLAMA_ENDPOINT,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        mode:"cors",
        body:JSON.stringify({
          model:OLLAMA_MODEL,
          messages:[
            {role:"system",content:"Você é a IA principal da Dev_Anabel. Responda em português do Brasil e priorize programação, depuração, jogos, web e explicações técnicas."},
            {role:"user",content:prompt}
          ],
          stream:false
        }),
        signal:controller.signal
      });
      const data=await response.json().catch(()=>({}));
      const text=String(data?.message?.content||"").trim();
      if(!response.ok||!text)throw new Error(data?.error||("HTTP "+response.status));
      const model=String(data?.model||OLLAMA_MODEL);
      log("ANABEL [OLLAMA / "+model.toUpperCase()+"]: "+text);
      status.textContent="IA local ativa: "+model;
      return true;
    }catch(error){
      const message=error?.name==="AbortError"?"tempo esgotado":String(error?.message||error||"falha desconhecida");
      console.warn("Dev_Anabel Ollama:",message);
      if(error?.name==="TypeError"){
        console.error("ANABEL OLLAMA: provável CORS ou endpoint indisponível.", {endpoint:OLLAMA_ENDPOINT, model:OLLAMA_MODEL, error});
        log("ANABEL: Ollama bloqueado pelo navegador. Verifique OLLAMA_ORIGINS e se o Ollama está aberto.");
      }else{
        log("ANABEL: Ollama local indisponível → "+message);
      }
      return false;
    }finally{
      clearTimeout(timer);
    }
  }

    try{

  function intent(text){
    const n=norm(text);
    const url=text.match(/https?:\/\/[^\s<>"]+/i)?.[0]?.replace(/[),.;]+$/,"");
    if(url)return {type:"url",value:url};
    if(/^\/?(ajuda|help|comandos)(\s|$)/.test(n))return {type:"help"};
    if(/^\/?(fontes?|source)(\s|$)/.test(n))return {type:"sources"};
    if(/^\/?ollama(\s|$)/.test(n))return {type:"ollama"};
    if(/^\/?(desfazer|undo|voltar)(\s|$)/.test(n))return {type:"undo"};
    if(/^(sim|s|yes|y|go|ok|okay|pode|manda|confirmo)$/.test(n)||/^(nao|não|n|no|cancelar|cancelo)$/.test(n))return {type:"confirm",value:n};
    if(/^\/?(executar|rodar|run|play)(\s|$)/.test(n))return {type:"run"};
    if(/^\/?dica(\s|$)/.test(n)||/\bdica\b.*\b(codigo|código|erro|programacao|programação)\b/.test(n))return {type:"tip"};
    if(/\bspace\s*invaders?\b|\binvaders?\b/.test(n))return {type:"space"};
    if(/^\/?(analisar|analise|audit|diagnostico)(\s|$)/.test(n)||/\b(analisar|analise|audit|diagnostico)\b.*\b(codigo|editor)\b/.test(n))return {type:"analyze"};
    if(/^\/?(refatorar|modernizar|otimizar)(\s|$)/.test(n)||/console\.log|\bvar\b.*\blet\b|arrow function/.test(n))return {type:"refactor"};
    if(/^\/?(corrigir|corrija|consertar|conserte|arrumar|arrume|fix|reparar|repare)(\s|$)/.test(n)||/\b(corrija|conserte|arrume|repare|corrigir|consertar|arrumar|reparar)\b.*\b(codigo|código|erro|bug|falha)\b/.test(n))return {type:"fix"};
    if(/^\/?(melhorar|melhore|melhorias|sugestoes|sugestões)(\s|$)/.test(n)||/\b(ideias?|sugestoes?|sugestões)\b.*\b(melhoria|melhorias|melhorar|codigo|código)\b/.test(n))return {type:"improve"};
    const select=n.match(/\b(?:ideia|opcao|opção)\s*([1-5])\b/)||n.match(/\b(?:gostei|escolho|quero)\b.*\b([1-5])\b/);
    if(select)return {type:"select",value:Number(select[1])};
    if(/^\/?ideias?(\s|$)/.test(n)||/\b(dica|sugestao|sugestão)\b.*\b(jogo|game)\b/.test(n))return {type:"ideas",value:n.replace(/^\/?ideias?\s*/,"")};
    if(/\b(?:procure|encontre|busque|ache)\b/.test(n)&&/\b(?:codigo|código|script|exemplo|implementacao|implementação)\b/.test(n))return {type:"autonomousSearch",value:text.replace(/\b(?:procure|encontre|busque|ache|pesquise|pesquisar)\b/gi,"").replace(/\b(?:me\s+)?(?:de|dê|traga|entregue|entregar)\b/gi,"").replace(/\b(?:codigo|código)\b/gi,"").trim()};
    if(/\b(?:me de|me dê|me entregue)\b.*\bcodigo\b/.test(n))return {type:"generate"};
    if(/\b(?:pesquise|pesquisa|pesquisar|busque|buscar|procure|na internet|na rede)\b/.test(n)&&/\b(?:codigo|código|script|exemplo|implemente|implementacao|implementação)\b/.test(n))return {type:"researchCode",value:text.replace(/\b(?:pesquise|pesquisa|pesquisar|busque|buscar|procure|na internet|na rede)\b/gi,"").replace(/\b(?:me\s+)?(?:de|dê|traga|entregue|entregar)\b/gi,"").replace(/\b(?:codigo|código)\b/gi,"").trim()};
    if(/^\/?(pesquisar|pesquisa|buscar|busca)(\s|$)/.test(n)||/\b(busque|buscar|pesquise|pesquisar|procure|na rede|na internet)\b/.test(n))return {type:"research",value:text.replace(/\b(busque|buscar|pesquise|pesquisa|pesquisar|procure|na rede|na internet)\b/gi,"").trim()};
    if(/\b(?:c[oó]digo|script|implementa[cç][aã]o|exemplo)\b/.test(n)&&/\b(?:como|criar|fazer|faca|faça|usar|implementar|exemplo|gera|gerar|preciso|quero|me d[eê]|me entregue)\b/.test(n))return {type:"researchCode",value:text};
    if(/\b(o que e|o que é|como funciona|como faco|como faço|como criar|como usar|explique|explica|por que|por quê|qual a melhor maneira)\b/.test(n))return {type:"question",value:text};
    if(/\b(crie|criar|gere|gerar|faça|faca|desenvolva|codifique|entregue|me de|me dê|me entregue)\b.*\b(jogo|game|codigo|código|prototipo|protótipo)\b/.test(n))return {type:"generate"};
    return {type:"fallback",value:text};
  }

  function applyPending(text){

    if(/^(sim|s|yes|y|go|ok|okay|pode|manda|confirmo)$/.test(n)){
      const action=state.pendingAction;state.pendingAction=null;

    log("ANABEL: responda sim, s, yes, go, ok ou não.");
  }

  async function handleCommand(text){
    const i=intent(text);

    if(i.type==="help"){
      log("COMANDOS: /ajuda · /ollama · /pesquisar assunto · /ideias assunto · /analisar · /corrigir · /melhorar · /refatorar · /executar · /desfazer · /fontes");
      log("NATURAL: faça perguntas, mande uma URL, peça uma ideia, escolha uma ideia e peça o código.");
      return;
    }

    if(i.type==="sources"){
      if(!state.sourceList.length)log("ANABEL: nenhuma referência nesta sessão.");
      else{log("ANABEL: "+state.sourceList.length+" referência(s) disponíveis.");sources.classList.add("show");}
      return;
    }

    if(i.type==="ollama"){await testOllamaConnection();return;}
    if(i.type==="undo"){undo();return;}
    if(i.type==="confirm"){applyPending(i.value);return;}
    if(i.type==="run"){run(editor.value);return;}
    if(i.type==="tip"){contextualTip();return;}
    if(i.type==="space"){editor.value=spaceGame();log("ANABEL: Space Invaders carregado no editor.");switchTab(1);return;}

    if(i.type==="improve"){improvementIdeas();return;}
    if(i.type==="refactor"){await refactor();return;}
    if(i.type==="url"){await loadUrl(i.value);return;}
    if(i.type==="autonomousSearch"){await autonomousSearch(i.value,"comando autônomo do usuário");return;}
    if(i.type==="researchCode"){await researchCode(i.value);return;}
    if(i.type==="research"){await research(i.value);return;}
    if(i.type==="question"){await smartAnswer(i.value);return;}
    if(i.type==="ideas"){await ideas(i.value||"jogo estratégia 8-bit");return;}
    if(i.type==="select"){selectIdea(i.value);return;}
    if(i.type==="generate"){if(state.selectedIdea)generate();else await autonomousSearch(i.value||text,"pedido de código sem ideia selecionada");return;}

    const item=known(i.value);
    if(item){await smartAnswer(i.value);return;}

    log("ANABEL: posso pesquisar, explicar, analisar o código, refatorar, gerar ideias ou executar o Sandbox.");

  }

      await navigator.clipboard.writeText(correctedOutput.value);
      status.textContent="Código corrigido copiado.";
      log("ANABEL: código corrigido copiado para a área de transferência.");
    }catch(e){
      correctedOutput.focus();correctedOutput.select();
      status.textContent="Selecione e copie manualmente.";
      log("ANABEL: o navegador bloqueou a cópia automática; o código foi selecionado.");
    }
  });

  if(new URLSearchParams(location.search).get("selftest")==="1"){
    const checks=[
      ["DOM",!!canvas&&!!editor&&!!sandbox&&!!input&&!!send],
      ["Canvas",!!ctx],
      ["Intent: análise",intent("Anabel analise meu codigo").type==="analyze"],
      ["Intent: pergunta",intent("como criar um jogo").type==="question"],
      ["Intent: ideias",intent("Anabel quero uma dica de jogo de estrategia").type==="ideas"],
      ["Intent: pesquisa",intent("/pesquisar Canvas").type==="research"],
      ["Intent: pesquisa + código",intent("/pesquisar codigo canvas").type==="researchCode"],
      ["Extrator de código",extractCodeBlocks("```js\nconst x=1;\nconsole.log(x);\n```").length===1],
      ["Leitor web",typeof readWebPage==="function"],
      ["Loop autônomo",typeof autonomousSearch==="function"&&searchVariations("canvas").length===4],
      ["Código natural",intent("quero o código de um botão javascript").type==="researchCode"],
      ["Qualidade autônoma",codeQualityScore("function x(){try{return 1}catch(e){throw e}}","javascript").score>0],
      ["Intent: Space Invaders",intent("crie space invaders").type==="space"],
      ["Intent: aprovação",intent("sim").type==="confirm"],
      ["Intent: URL",intent("https://example.com/test.html").type==="url"],
      ["Intent: código",intent("me dê o código").type==="generate"],
      ["var→let",refactorVar("var x=1;").code.includes("let x")],
      ["console.log",removeLogs("console.log(1);\nlet x=1;").count===1],
      ["Arrow",arrows("const f=function(a){return a+1;};").count===1],
      ["Sandbox",sandbox.getAttribute("sandbox")==="allow-scripts"],
      ["Python detector",detectLanguage("def soma(a,b):\n    return a+b")==="python"],
      ["Python autocomplete",pythonSuggestions().length>0],
      ["Web runner",typeof webRuntimeHTML==="function"],
      ["Mobile tabs",qsa(".tab").length===3],
      ["Mobile pad",qsa(".pad").length===3],
      ["Fontes",typeof addSource==="function"],
      ["Linhas numeradas",!!lineNumbers],
      ["Persistência local",typeof saveSession==="function"&&typeof restoreSession==="function"],
      ["Fallback Pyodide",/v314\.0\.7\/full|v0\.29\.5\/full/.test(pythonRuntimeHTML())],
      ["Resize com debounce",typeof debouncedResize==="function"],
      ["Referrer do Sandbox",sandbox.getAttribute("referrerpolicy")==="no-referrer"],
      ["Sandbox sem same-origin",!sandbox.getAttribute("sandbox").includes("allow-same-origin")],
      ["Ollama configurado",OLLAMA_ENDPOINT.includes("11434/api/chat")&&OLLAMA_MODEL==="gemma4:31b-cloud"],
      ["Teste Ollama exposto",typeof testOllamaConnection==="function"]
    ];
    const ok=checks.filter(x=>x[1]).length;
    log("SELFTEST: "+ok+"/"+checks.length+" verificações aprovadas.");
    checks.filter(x=>!x[1]).forEach(x=>log("SELFTEST FALHA: "+x[0]));
  }
})();
