<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Dev_Anabel — Retro Development Bot</title>
<style>
:root{--bg:#050505;--panel:#000;--border:#333;--fg:#00ff33;--glow:rgba(0,255,51,.2);--muted:#888;--warn:#ffcc00}
[data-theme="amber"]{--fg:#ffb000;--glow:rgba(255,176,0,.2)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:monospace}
body{padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px;overscroll-behavior:contain}
button,input,textarea,select{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
header{width:100%;max-width:1400px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:20px;letter-spacing:2px;text-transform:uppercase}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tool,.theme select{background:#101010;color:var(--fg);border:1px solid var(--fg);padding:7px 10px;cursor:pointer}
.theme{display:flex;gap:5px;align-items:center}
#file-input{display:none}
.mobile-tabs{display:none;width:100%;gap:5px}
.tab{flex:1;background:#101010;color:var(--muted);border:1px solid var(--border);padding:10px;cursor:pointer}
.tab.active{color:var(--fg);border-color:var(--fg)}
#workspace{width:1400px;max-width:100%;height:min(480px,64vh);min-height:310px;display:flex;gap:12px}
.panel{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.label{font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase}
canvas,#sandbox,#editor{width:100%;height:100%;min-height:0}
canvas{display:block;background:#000;border:2px solid var(--border);box-shadow:0 0 20px var(--glow)}
#editor-wrap{position:relative;flex:1;min-height:0;display:flex}#editor{flex:1;resize:none;background:#0b0b0b;color:var(--fg);border:2px solid var(--border);padding:12px;outline:none;white-space:pre;font:12px/1.4 "Courier New",monospace;tab-size:4}#editor-meta{position:absolute;top:5px;right:8px;z-index:4;font-size:9px;color:var(--muted);pointer-events:none;background:#000b;padding:2px 5px}#autocomplete{display:none;position:absolute;z-index:20;left:10px;top:10px;width:min(390px,calc(100% - 20px));max-height:210px;overflow:auto;background:#050505;border:1px solid var(--fg);box-shadow:0 0 15px var(--glow);font:11px/1.35 "Courier New",monospace}#autocomplete.show{display:block}.ac-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 8px;cursor:pointer}.ac-item:hover,.ac-item.selected{background:var(--fg);color:#000}.ac-kind{opacity:.7}.ac-item.selected .ac-kind{opacity:.85}.ac-empty{padding:7px 8px;color:var(--muted)}
#sandbox{display:block;border:2px solid var(--border);background:#000}
#controls{width:1400px;max-width:100%;display:flex;flex-direction:column;gap:7px}
#input-row{display:flex;gap:6px}
#input{flex:1;min-width:0;background:#000;color:var(--fg);border:1px solid var(--fg);padding:12px;font-size:16px}
#send{background:var(--fg);color:#000;border:0;padding:0 22px;font-weight:bold;cursor:pointer}
#quick{display:flex;gap:5px;flex-wrap:wrap}
.quick{background:#101010;color:var(--fg);border:1px solid var(--fg);padding:5px 8px;font-size:10px;cursor:pointer}
#sources{display:none;max-height:130px;overflow:auto;background:#030303;border-top:1px solid var(--border);padding:7px;font-size:10px}
#sources.show{display:block}
.source{margin-bottom:6px;line-height:1.35}.source a{color:var(--fg);word-break:break-all}.source span{color:var(--muted)}
#review{width:1400px;max-width:100%;display:grid;grid-template-columns:minmax(260px,.7fr) minmax(360px,1.3fr);gap:8px}
.review-box{background:#030303;border:2px solid var(--border);padding:9px;min-width:0}
.review-title{color:var(--fg);font-size:11px;text-transform:uppercase;margin-bottom:7px}
#review-summary{font-size:11px;line-height:1.4;color:var(--muted);margin-bottom:7px}
#review-list{margin:0;padding-left:18px;font-size:11px;line-height:1.45}
#review-list li{margin:4px 0}
#corrected-output{width:100%;height:240px;resize:vertical;background:#080808;color:var(--fg);border:1px solid var(--fg);padding:9px;font:11px/1.4 "Courier New",monospace;white-space:pre;tab-size:4}
#copy-corrected{margin-top:7px;background:#101010;color:var(--fg);border:1px solid var(--fg);padding:7px 10px;cursor:pointer}
@media(max-width:900px){#review{grid-template-columns:1fr}}
#status{font-size:10px;color:var(--muted);min-height:13px}
#pad{display:none;justify-content:center;gap:10px}
.pad{background:#202020;color:var(--fg);border:2px solid var(--fg);padding:13px 24px;touch-action:manipulation}
.drop{border-color:var(--fg)!important;box-shadow:0 0 15px var(--glow)!important}
@media(max-width:900px){.mobile-tabs{display:flex}.panel{display:none}.panel.visible{display:flex}#workspace{height:58vh;min-height:290px}.toolbar{width:100%}.toolbar>*{flex:1}#pad{display:flex}}
@media(max-width:520px){h1{font-size:16px}.theme{width:100%}.theme select{flex:1}#input-row{flex-direction:column}#send{min-height:44px}.quick{flex:1;text-align:center}.pad{flex:1}}
</style>
</head>
<body>
<header>
<h1>Dev_Anabel Core System</h1>
<div class="toolbar">
<label class="tool" for="file-input">📎 ANEXAR</label>
<input id="file-input" type="file" multiple accept=".html,.htm,.js,.mjs,.css,.json,.txt,.md,.xml,.svg,.csv,.py,.java,.c,.cpp,.h,.hpp,.cs,.ts,.tsx,.jsx">
<button class="tool" id="export" type="button">💾 EXPORTAR</button>
<button class="tool" id="undo" type="button">↶ DESFAZER</button>
<div class="theme"><span>CRT:</span><select id="theme"><option value="green">VERDE</option><option value="amber">ÂMBAR</option></select></div>
</div>
</header>
<div class="mobile-tabs">
<button class="tab active" type="button" data-tab="0">Terminal</button>
<button class="tab" type="button" data-tab="1">Código</button>
<button class="tab" type="button" data-tab="2">Live View</button>
</div>
<main id="workspace">
<section class="panel visible" id="p0"><div class="label">📟 Terminal CRT</div><canvas id="terminal" width="450" height="450"></canvas><div id="sources"></div></section>
<section class="panel" id="p1"><div class="label">💻 Professor Python / Código Fonte</div><div id="editor-wrap"><textarea id="editor" spellcheck="false" placeholder="# Python: escreva aqui e pressione Ctrl+Espaço para sugestões..."></textarea><div id="editor-meta">LINGUAGEM: AUTO · AUTOCOMPLETE: CTRL+ESPAÇO</div><div id="autocomplete" role="listbox" aria-label="Sugestões de código"></div></div></section>
<section class="panel" id="p2"><div class="label">🚀 Sandbox de Execução</div><iframe id="sandbox" title="Live View" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></section>
</main>
<section id="controls">
<div id="input-row"><input id="input" autocomplete="off" autofocus placeholder="Ex.: Anabel, me dê uma ideia de jogo de estratégia 8-bit"><button id="send" type="button">EXECUTAR</button></div>
<div id="quick">
<button class="quick" data-command="/ajuda" type="button">/ajuda</button>
<button class="quick" data-command="/analisar" type="button">/analisar</button>
<button class="quick" data-command="/corrigir" type="button">/corrigir</button>
<button class="quick" data-command="/melhorar" type="button">/melhorar</button>
<button class="quick" data-command="/refatorar" type="button">/refatorar</button>
<button class="quick" data-command="/executar" type="button">/executar</button>
<button class="quick" data-command="/ideias jogo estratégia 8-bit" type="button">/ideias</button>
<button class="quick" data-command="/fontes" type="button">/fontes</button>
</div>
<div id="status"></div>
</section>
<section id="review" aria-live="polite">
<div class="review-box">
<div class="review-title">🔎 Ideias de melhoria</div>
<div id="review-summary">Analise ou corrija um código para gerar recomendações técnicas.</div>
<ul id="review-list"></ul>
</div>
<div class="review-box">
<div class="review-title">🛠️ Código corrigido</div>
<textarea id="corrected-output" spellcheck="false" readonly placeholder="O código corrigido aparecerá aqui."></textarea>
<button id="copy-corrected" type="button">COPIAR CÓDIGO</button>
</div>
</section>
<section id="pad"><button class="pad" id="left" type="button">◀ ESQ</button><button class="pad" id="fire" type="button">FOGO</button><button class="pad" id="right" type="button">DIR ▶</button></section>
<script>

"use strict";
(()=> {
  const $=(s,r=document)=>r.querySelector(s);
  const qsa=(s,r=document)=>[...r.querySelectorAll(s)];
  const canvas=$("#terminal"),ctx=canvas.getContext("2d",{alpha:false});
  const editor=$("#editor"),sandbox=$("#sandbox"),input=$("#input"),send=$("#send");
  const fileInput=$("#file-input"),sources=$("#sources"),status=$("#status");
  const reviewSummary=$("#review-summary"),reviewList=$("#review-list"),correctedOutput=$("#corrected-output"),copyCorrected=$("#copy-corrected");
  const autocomplete=$("#autocomplete"),editorMeta=$("#editor-meta");
  let runtimeKind="",pythonRuntimeReady=false,pendingPythonCode=null,acItems=[],acIndex=0;
  const state={
    theme:"green",color:"#00ff33",busy:false,queued:false,sandboxUrl:"",language:"auto",
    history:[
      "ANABEL: sistema iniciado.",
      "ANABEL: bot local sem LLM.",
      "ANABEL: conhecimento, regras, pesquisa e ferramentas ativas."
    ],
    sourceList:[],snapshots:[],ideas:[],selectedIdea:null,pendingAction:null,
    review:{issues:[],improvements:[],correctedCode:""}
  };

  const norm=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
  const esc=v=>String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
  function log(v){state.history.push(String(v));drawLater();}
  function drawLater(){if(state.queued)return;state.queued=requestAnimationFrame(()=>{state.queued=false;draw();});}
  function draw(){
    const r=canvas.getBoundingClientRect(),d=Math.max(1,Math.min(2,devicePixelRatio||1));
    const w=Math.max(1,Math.floor((r.width||450)*d)),h=Math.max(1,Math.floor((r.height||450)*d));
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
    const cw=r.width||450,ch=r.height||450;
    ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,cw,ch);
    ctx.fillStyle=state.color;ctx.shadowColor=state.color;ctx.shadowBlur=3;ctx.font="12px monospace";ctx.textBaseline="top";
    const lh=17,max=Math.max(1,Math.floor((ch-12)/lh)),start=Math.max(0,state.history.length-max),chars=Math.max(30,Math.floor((cw-18)/7.1));
    for(let i=start;i<state.history.length;i++){let t=state.history[i].replace(/\s+/g," ").trim();if(t.length>chars)t=t.slice(0,chars-1)+"…";ctx.fillText(t,9,7+(i-start)*lh);}
    ctx.shadowBlur=0;
  }
  function switchTab(i){
    i=Number(i);if(![0,1,2].includes(i))return;
    qsa(".tab").forEach((b,n)=>{b.classList.toggle("active",n===i);b.setAttribute("aria-selected",String(n===i));});
    qsa(".panel").forEach((p,n)=>p.classList.toggle("visible",n===i));
    if(i===0)drawLater();
  }
  function theme(v){
    state.theme=v==="amber"?"amber":"green";
    document.documentElement.toggleAttribute("data-theme",state.theme==="amber");
    if(state.theme==="amber")state.color="#ffb000";else state.color="#00ff33";
    const title=sandbox.contentDocument?.getElementById("title");if(title)title.style.color=state.color;
    drawLater();
  }
  function snapshot(label){state.snapshots.push({label,code:editor.value});if(state.snapshots.length>40)state.snapshots.shift();}
  function undo(){
    const x=state.snapshots.pop();if(!x){log("ANABEL: não há estado anterior.");return;}
    editor.value=x.code;log("ANABEL: estado restaurado → "+x.label);switchTab(1);
  }
  function revokeSandbox(){if(state.sandboxUrl){URL.revokeObjectURL(state.sandboxUrl);state.sandboxUrl="";}runtimeKind="";pythonRuntimeReady=false;pendingPythonCode=null;}
  function detectLanguage(code){
    const s=String(code||"").trimStart();
    if(/^(<!doctype html|<html\b|<body\b|<canvas\b|<style\b|<script\b)/i.test(s)||/<(?:div|main|section|head|title)\b/i.test(s))return "html";
    if(/^(from\s+[A-Za-z_][\w.]*\s+import|import\s+[A-Za-z_][\w.]*)/m.test(s)||/^(def|class)\s+[A-Za-z_]\w*\s*\(?/m.test(s)||/\bprint\s*\(/.test(s)||/if\s+__name__\s*==\s*["']__main__["']/.test(s))return "python";
    if(/\b(const|let|var)\s+[A-Za-z_$][\w$]*\s*=|=>|document\.\w+|console\.log\s*\(/.test(s))return "javascript";
    return state.language==="python"?"python":"javascript";
  }
  function setLanguage(lang){
    state.language=lang||"auto";
    const shown=state.language==="auto"?detectLanguage(editor.value):state.language;
    if(editorMeta)editorMeta.textContent="LINGUAGEM: "+String(shown).toUpperCase()+" · AUTOCOMPLETE: CTRL+ESPAÇO / TAB";
  }
  function pythonRuntimeHTML(){
    const pyodideCdn="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/";
    const boot=`(async()=>{const state=document.getElementById("state"),out=document.getElementById("out"),NL=String.fromCharCode(10);let pyodide=null;function send(type,data){parent.postMessage(Object.assign({source:"dev-anabel-python",type:type},data||{}),"*")}function emit(kind,value){const s=String(value==null?"":value);if(s)out.textContent+=s;send("output",{kind:kind,text:s})}function loadScript(src){return new Promise(function(resolve,reject){const s=document.createElement("script");s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}try{await loadScript("${pyodideCdn}pyodide.js");pyodide=await loadPyodide({indexURL:"${pyodideCdn}"});pyodide.setStdout({batched:function(s){emit("stdout",s)}});pyodide.setStderr({batched:function(s){emit("stderr",s)}});state.textContent="PYTHON: ambiente pronto";send("ready",{version:String(pyodide.runPython("import sys;sys.version"))})}catch(err){state.textContent="PYTHON: falha ao inicializar";send("error",{error:String(err)})}window.addEventListener("message",async function(e){const d=e.data||{};if(d.source!=="dev-anabel-python"||!pyodide||d.action!=="run")return;state.textContent="PYTHON: executando…";try{await pyodide.loadPackagesFromImports(String(d.code||""));const result=await pyodide.runPythonAsync(String(d.code||""));if(result!==undefined&&result!==null)emit("result",String(result)+NL);send("done",{ok:true})}catch(err){emit("stderr",String(err)+NL);send("done",{ok:false,error:String(err)})}state.textContent="PYTHON: pronto"})})()`;
    const safeBoot=boot;
    return '<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Runtime</title><style>body{margin:0;background:#000;color:#00ff33;font:12px monospace;padding:10px}#state{border:1px solid #333;padding:7px;margin-bottom:8px}pre{white-space:pre-wrap;margin:0;border:1px solid #333;background:#050505;padding:10px;min-height:220px;overflow:auto}</style></head><body><div id="state">PYTHON: carregando…</div><pre id="out"></pre><script>'+safeBoot+'<\/script></body></html>';
  }
  function postPython(action,code){
    if(!sandbox.contentWindow){log("ANABEL: ambiente Python ainda não está disponível.");return false;}
    sandbox.contentWindow.postMessage({source:"dev-anabel-python",action,code},"*");return true;
  }
  function runPython(code){
    const source=String(code||"");
    if(!source.trim()){log("ANABEL: não há código Python para executar.");return false;}
    switchTab(2);status.textContent=pythonRuntimeReady?"Python pronto.":"Carregando ambiente Python…";
    if(runtimeKind!=="python"){
      revokeSandbox();
      runtimeKind="python";pythonRuntimeReady=false;pendingPythonCode=source;
      state.sandboxUrl=URL.createObjectURL(new Blob([pythonRuntimeHTML()],{type:"text/html;charset=utf-8"}));
      sandbox.src=state.sandboxUrl;
      log("ANABEL: conectando ao ambiente Python (Pyodide/CPython WebAssembly)…");
      return true;
    }
    if(pythonRuntimeReady){pendingPythonCode=null;postPython("run",source);log("ANABEL: Python enviado ao ambiente persistente.");}
    else{pendingPythonCode=source;log("ANABEL: Python aguardando o ambiente ficar pronto.");}
    return true;
  }
  function webRuntimeHTML(code,language){
    const source=String(code||"");
    const safeSource=source.replaceAll("</script","<\\/script").replaceAll("</SCRIPT","<\\/SCRIPT");
    const bootstrap='<script>(()=>{addEventListener("error",e=>parent.postMessage({source:"dev-anabel-runtime",type:"error",error:String(e.message||"erro no runtime")},"*"));addEventListener("unhandledrejection",e=>parent.postMessage({source:"dev-anabel-runtime",type:"error",error:String(e.reason||"Promise rejeitada")},"*"));const oldLog=console.log.bind(console);console.log=(...a)=>{oldLog(...a);parent.postMessage({source:"dev-anabel-runtime",type:"log",text:a.map(String).join(" ")},"*")};})()<\\/script>';
    if(language==="css"){
      return '<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+bootstrap+'<style>'+source.replaceAll("</style","<\\/style").replaceAll("</STYLE","<\\/STYLE")+'</style></head><body><div id="app"></div></body></html>';
    }
    const module=/^\\s*(?:import|export)\\b/m.test(source);
    const scriptTag=module?'<script type="module">':'<script>';
    return '<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+bootstrap+'</head><body><div id="app"></div>'+scriptTag+safeSource+'<\\/script></body></html>';
  }
  function run(code){
    if(!String(code||"").trim()){log("ANABEL: não há código para executar.");return false;}
    const language=state.language==="auto"?detectLanguage(code):state.language;
    if(language==="python")return runPython(code);
    revokeSandbox();
    runtimeKind="html";
    const source=String(code);
    const themed=state.theme==="amber"?source.replaceAll("#00ff33","#ffb000").replaceAll("#0f3","#ffb000"):source;
    const full=/<!doctype html|<html\\b/i.test(themed.trim())?themed:webRuntimeHTML(themed,language);
    state.sandboxUrl=URL.createObjectURL(new Blob([full],{type:"text/html;charset=utf-8"}));
    sandbox.src=state.sandboxUrl;log("ANABEL: código "+(language==="javascript"?"JavaScript":"web")+" executado no Sandbox isolado.");switchTab(2);status.textContent="Sandbox web ativo.";return true;
  }
  function post(command){
    if(!sandbox.contentWindow){log("ANABEL: Sandbox ainda não está pronto.");return;}
    sandbox.contentWindow.postMessage({source:"dev-anabel",command},"*");
  }
  function renderSources(){
    if(!state.sourceList.length){sources.classList.remove("show");sources.innerHTML="";return;}
    sources.innerHTML=state.sourceList.slice(-15).map(s=>'<div class="source"><span>['+esc(s.kind)+']</span> <a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.title)+'</a><div>'+esc(s.note)+'</div></div>').join("");
    sources.classList.add("show");
  }
  function addSource(s){
    if(!s?.url||state.sourceList.some(x=>x.url===s.url))return;
    state.sourceList.push({kind:s.kind||"WEB",title:s.title||s.url,url:s.url,note:s.note||""});renderSources();
  }
  async function handleFiles(files){
    for(const file of [...(files||[])]){
      const ext=(file.name.split(".").pop()||"").toLowerCase();
      const allowed=["html","htm","js","mjs","css","json","txt","md","xml","svg","csv","py","java","c","cpp","h","hpp","cs","ts","tsx","jsx"];
      if(!allowed.includes(ext)){log("ANABEL: formato não suportado → "+file.name);continue;}
      try{snapshot("antes de anexar "+file.name);editor.value=await file.text();state.language=ext==="py"?"python":"auto";setLanguage(state.language);log("SISTEMA: arquivo anexado → "+file.name);}
      catch(e){console.error(e);log("ANABEL: falha ao ler "+file.name);}
    }
    switchTab(1);fileInput.value="";
  }
  async function loadUrl(url){
    let target=url;
    try{
      const u=new URL(url),p=u.pathname.split("/").filter(Boolean),i=p.indexOf("blob");
      if(u.hostname==="github.com"&&i>=2&&p.length>i+2)target="https://raw.githubusercontent.com/"+p[0]+"/"+p[1]+"/"+p[i+1]+"/"+p.slice(i+2).join("/");
    }catch(e){}
    status.textContent="Carregando URL…";
    try{
      const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);
      const r=await fetch(target,{signal:c.signal});clearTimeout(timer);
      if(!r.ok)throw new Error("HTTP "+r.status);
      snapshot("antes do carregamento remoto");editor.value=await r.text();state.language=/\.py(?:$|\?)/i.test(target)?"python":"auto";setLanguage(state.language);
      addSource({kind:"URL",title:target,url:target,note:"Arquivo carregado diretamente da rede."});
      log("ANABEL: conteúdo remoto carregado.");switchTab(1);status.textContent="URL carregada.";
    }catch(e){console.error(e);log("ANABEL: a URL não pôde ser lida. O servidor pode bloquear CORS.");status.textContent="Falha na URL.";}
  }
  function exportCode(){
    if(!editor.value.trim()){log("ANABEL: buffer vazio.");return;}
    const url=URL.createObjectURL(new Blob([editor.value],{type:"text/html;charset=utf-8"})),a=document.createElement("a");
    a.href=url;a.download=(state.language==="python"||detectLanguage(editor.value)==="python")?"dev_anabel.py":"dev_anabel_export.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0);log("ANABEL: exportação concluída.");
  }
  Object.assign(window,{switchTab,changeTheme:theme,exportCode,handleFileAttach:i=>handleFiles(i?.files||[]),DevAnabel:{state,switchTab,theme,run,undo,loadUrl,handleFiles}});
  window.addEventListener("resize",drawLater,{passive:true});
  window.addEventListener("orientationchange",drawLater,{passive:true});
  sandbox.addEventListener("load",()=>{
    const t=sandbox.contentDocument?.getElementById("title");if(t)t.style.color=state.color;
    if(runtimeKind==="python")status.textContent="Ambiente Python carregado; aguardando CPython…";
  });
  window.addEventListener("message",e=>{
    const d=e.data;if(!d)return;
    if(d.source==="dev-anabel-runtime"){

  function currentPythonContext(){

    const importCtx=/(?:^|[;\s])(from|import)\s+([A-Za-z_]\w*(?:\.[A-Za-z_]\w*)*)?$/.exec(line);

  function localPythonSymbols(){
    const code=editor.value,out=new Set();
    for(const re of [/\bdef\s+([A-Za-z_]\w*)/g,/\bclass\s+([A-Za-z_]\w*)/g,/\b([A-Za-z_]\w*)\s*=\s*(?![=])/g,/\bas\s+([A-Za-z_]\w*)/g]){
      let m;while((m=re.exec(code)))out.add(m[1]);

  function pythonSuggestions(){

  function pythonIndent(e){
    if(detectLanguage(editor.value)!=="python")return false;
    if(e.key==="Tab"){
      e.preventDefault();
      if(autocomplete.classList.contains("show")&&acItems.length)return acceptAutocomplete();
      const a=editor.selectionStart,b=editor.selectionEnd,selected=editor.value.slice(a,b);
      const currentLine=editor.value.slice(0,a).split("\n").pop()||"";
      const indent=(currentLine.match(/^\s*/)||[""])[0];
      if(a!==b)editor.setRangeText(selected.split("\n").map(x=>indent+"    "+x).join("\n"),a,b,"select");
      else editor.setRangeText("    ",a,b,"end");
      renderAutocomplete(false);return true;
    }
    if(e.key==="Enter"){
      if(autocomplete.classList.contains("show")&&acItems.length){e.preventDefault();return acceptAutocomplete();}
      e.preventDefault();
      const pos=editor.selectionStart,before=editor.value.slice(0,pos),line=before.slice(before.lastIndexOf("\n")+1);
      const base=(line.match(/^\s*/)||[""])[0];
      const extra=/:\s*$/.test(line)?"    ":"";
      let text="\n"+base+extra;
      editor.setRangeText(text,pos,editor.selectionEnd,"end");
      const newLine=editor.value.slice(0,editor.selectionStart).split("\n").pop()||"";
      if(/^\s*(elif|else|except|finally)\b/.test(newLine)&&/^(\s*)(elif|else|except|finally)\b/.test(newLine)){
        const currentIndent=(newLine.match(/^\s*/)||[""])[0];
        if(currentIndent.length>=4){
          const p=editor.selectionStart-currentIndent.length;
          editor.setRangeText("",p,p+4,"end");
        }
      }
      renderAutocomplete(false);return true;
    }
    return false;
  }

  function mask(code){
    let out="",mode="code",quote="";
    for(let i=0;i<code.length;i++){
      const c=code[i],n=code[i+1];
      if(mode==="code"){
        if(c==="/"&&n==="/"){out+="  ";mode="line";i++;continue;}
        if(c==="/"&&n==="*"){out+="  ";mode="block";i++;continue;}
        if(c==="\""||c==="'"||c===String.fromCharCode(96)){out+=" ";quote=c;mode="string";continue;}
        out+=c;continue;
      }
      if(mode==="line"){out+=c==="\n"?"\n":" ";if(c==="\n")mode="code";continue;}
      if(mode==="block"){out+=c==="\n"?"\n":" ";if(c==="*"&&n==="/"){out+=" ";i++;mode="code";}continue;}
      out+=c==="\n"?"\n":" ";
      if(c==="\\"){out+=" ";i++;continue;}
      if(c===quote)mode="code";
    }
    return out;
  }

  function refactorVar(code){
    const m=mask(code);let out="",count=0;
    for(let i=0;i<code.length;){
      const prev=i?m[i-1]:" ",next=m[i+3]||" ";
      if(m.slice(i,i+3)==="var"&&/[^A-Za-z0-9_$]/.test(prev)&&/\s/.test(next)){out+="let";i+=3;count++;}
      else{out+=code[i];i++;}
    }
    return {code:out,count};
  }

  function removeLogs(code){
    let count=0;
    const out=code.split("\n").filter(line=>{
      if(/^\s*console\.log\s*\([^;]*\)\s*;?\s*$/.test(line)){count++;return false;}
      return true;
    });
    return {code:out.join("\n"),count};
  }

  function arrows(code){
    let count=0;
    const re=/(?:const\s+([A-Za-z_$][\w$]*)\s*=\s*)?function\s*\(([^)]*)\)\s*\{\s*return\s+([^;{}]+);?\s*\}\s*;?/g;
    const out=code.replace(re,(match,name,args,expr)=>{
      count++;
      const body="("+args.trim()+") => "+expr.trim();
      return name?"const "+name+" = "+body+";":body+";";
    });
    return {code:out,count};
  }

  function buildImprovements(m,result,sourceCode=""){
    const raw=String(sourceCode||"");
    const out=[];
    if(result.varCount)out.push("Substitua var por let/const conforme a necessidade de reatribuição e escopo.");
    if(result.logCount)out.push("Remova console.log de diagnóstico que não seja necessário no código final.");
    if(result.functionCount>result.arrowCount)out.push("Modernize funções simples com retorno direto para Arrow Functions quando isso preservar o comportamento.");
    if(result.fetchCount)out.push("Valide response.ok, trate erros de rede e considere CORS antes de consumir a resposta.");
    if(/\bawait\b/.test(m))out.push("Proteja operações assíncronas com try/catch e trate estados de carregamento/falha.");
    if(/getContext\s*\(\s*["']2d["']\)/.test(raw))out.push("Para jogos e animações Canvas, centralize requestAnimationFrame e considere devicePixelRatio.");
    if(/innerHTML\s*=/.test(m))out.push("Evite inserir HTML dinâmico sem necessidade; prefira textContent para texto simples.");
    if(/addEventListener\s*\(/.test(m))out.push("Centralize listeners repetidos e remova listeners que não tenham mais utilidade.");
    if(/touch|pointer|click/.test(m))out.push("Teste entrada por toque e mouse em diferentes tamanhos de tela.");
    out.push("Mantenha funções pequenas, valide entradas e deixe uma responsabilidade clara em cada etapa.");
    return [...new Set(out)];
  }

    const issues=[];
    if(result.varCount)issues.push(result.varCount+" ocorrência(s) de var");
    if(result.logCount)issues.push(result.logCount+" console.log");
    if(result.functionCount>result.arrowCount)issues.push("funções simples passíveis de modernização");
    if(result.fetchCount)issues.push("uso de fetch");
    if(/\bawait\b/.test(mask(sourceCode)))issues.push("código assíncrono");
    state.review={issues,improvements,correctedCode};
    if(reviewSummary)reviewSummary.textContent=issues.length?
      "Revisão "+mode+": "+issues.join(" · ")+".":
      "Revisão "+mode+": nenhum problema básico detectado.";
    if(reviewList)reviewList.innerHTML=improvements.map(x=>"<li>"+esc(x)+"</li>").join("");
    if(correctedOutput)correctedOutput.value=correctedCode||sourceCode;
  }

  function analyzePython(code){
    const src=String(code||""),issues=[],suggestions=[];
    const lines=src.split("\n");
    let balance=0;
    for(const ch of src){if("([{".includes(ch))balance++;else if(")]}".includes(ch))balance--;}
    if(balance!==0)issues.push("delimitadores possivelmente desbalanceados");
    lines.forEach((line,i)=>{
      if(/^\s*(def|class|if|elif|else|for|while|try|except|finally|with|match|case)\b/.test(line)&&/:\s*(#.*)?$/.test(line)===false&&!/\b(else|try|finally)\b/.test(line))suggestions.push("linha "+(i+1)+": verifique os dois-pontos no fim do bloco");
      if(/^\s*(if|elif)\b.*(?<![=!<>])=(?!=)/.test(line))issues.push("linha "+(i+1)+": atribuição simples dentro de condição; talvez você queira == ou outra expressão");
      if(/^\s*print\s*\(.*\)\s*$/.test(line)&&/["']/.test(line)===false)suggestions.push("linha "+(i+1)+": confirme se o valor impresso é o esperado");
    });
    if(/\bexcept\s*:\s*$/.test(src))suggestions.push("Prefira exceções específicas quando isso não reduzir a clareza.");
    if(/\binput\s*\(/.test(src))suggestions.push("input() pode exigir uma interface própria no navegador; use widgets ou parâmetros para experiências web.");
    if(/\bglobal\b/.test(src))suggestions.push("Evite global quando uma função, classe ou retorno explícito resolver o mesmo problema.");
    return {issues:[...new Set(issues)],suggestions:[...new Set(suggestions)]};
  }

  function analyze(){
    const code=editor.value;
    if(!code.trim()){log("ANABEL: editor vazio.");return null;}
    if((state.language==="python"||detectLanguage(code)==="python")){
      const py=analyzePython(code);
      log("PROFESSOR PYTHON: análise concluída.");
      log("PYTHON: "+(py.issues.length?py.issues.join(" · "):"nenhum problema sintático básico evidente."));
      py.suggestions.forEach(x=>log("PYTHON DICA: "+x));
      const base={varCount:0,logCount:0,functionCount:0,arrowCount:0,fetchCount:0,python:true,pythonIssues:py.issues,pythonSuggestions:py.suggestions};
      state.review={issues:py.issues,improvements:[...py.suggestions,"Use Ctrl+Espaço para completar palavras, built-ins, módulos e símbolos do próprio arquivo."],correctedCode:code};
      renderReview({result:base,sourceCode:code,correctedCode:code,mode:"análise Python"});
      state.pendingAction=null;
      return base;
    }
    const m=mask(code);
    const result={
      varCount:(m.match(/\bvar\b/g)||[]).length,
      logCount:(m.match(/\bconsole\.log\s*\(/g)||[]).length,
      functionCount:(m.match(/\bfunction\b/g)||[]).length,
      arrowCount:(m.match(/=>/g)||[]).length,
      fetchCount:(m.match(/\bfetch\s*\(/g)||[]).length
    };
    log("ANABEL: análise concluída.");
    log("ANÁLISE: var="+result.varCount+" · console.log="+result.logCount+" · function="+result.functionCount+" · arrow="+result.arrowCount+" · fetch="+result.fetchCount);
    if(result.fetchCount)log("DICA: confira response.ok, tratamento de erros e CORS.");
    if(/\bawait\b/.test(m))log("DICA: código assíncrono encontrado; considere try/catch.");
    if(result.varCount)log("PERGUNTA DE ESCOPO: esta variável precisa existir fora do bloco onde foi criada?");
    if(result.fetchCount)log("PERGUNTA DE ASSINCRONISMO: o que deve acontecer quando a rede falhar ou responder devagar?");
    if(/\bArray\b|\bObject\b|\bMap\b|\bSet\b/.test(m))log("PERGUNTA DE ESTRUTURA: você precisa preservar ordem, buscar por chave ou impedir duplicidades?");
    renderReview({result,sourceCode:code,correctedCode:code,mode:"análise"});
    state.pendingAction=(result.varCount||result.logCount||result.functionCount>result.arrowCount)?{type:"refactor"}:null;
    if(state.pendingAction)log("ANABEL: existem correções automáticas disponíveis. Use /corrigir ou responda sim para aplicar a refatoração segura.");
    if(!result.varCount&&!result.logCount&&!result.fetchCount)log("DICA: nenhum dos padrões básicos conhecidos foi encontrado.");
    log("ANABEL: ideias de melhoria foram colocadas no painel lateral.");
    return result;
  }

  function intent(text){
    const n=norm(text);
    const url=text.match(/https?:\/\/[^\s<>"]+/i)?.[0]?.replace(/[),.;]+$/,"");
    if(url)return {type:"url",value:url};
    if(/^\/?(ajuda|help|comandos)(\s|$)/.test(n))return {type:"help"};
    if(/^\/?(fontes?|source)(\s|$)/.test(n))return {type:"sources"};
    if(/^\/?(desfazer|undo|voltar)(\s|$)/.test(n))return {type:"undo"};
    if(/^(sim|s|yes|y|go|ok|okay|pode|manda|confirmo)$/.test(n)||/^(nao|não|n|no|cancelar|cancelo)$/.test(n))return {type:"confirm",value:n};
    if(/^\/?(executar|rodar|run|play)(\s|$)/.test(n))return {type:"run"};
    if(/^\/?dica(\s|$)/.test(n)||/\bdica\b.*\b(codigo|código|erro|programacao|programação)\b/.test(n))return {type:"tip"};
    if(/\bspace\s*invaders?\b|\binvaders?\b/.test(n))return {type:"space"};
    if(/^\/?(analisar|analise|audit|diagnostico)(\s|$)/.test(n)||/\b(analisar|analise|audit|diagnostico)\b.*\b(codigo|editor)\b/.test(n))return {type:"analyze"};
    if(/^\/?(refatorar|modernizar|otimizar)(\s|$)/.test(n)||/console\.log|\bvar\b.*\blet\b|arrow function/.test(n))return {type:"refactor"};
    if(/^\/?(corrigir|corrija|consertar|conserte|arrumar|arrume|fix|reparar|repare)(\s|$)/.test(n)||/\b(corrija|conserte|arrume|repare|corrigir|consertar|arrumar|reparar)\b.*\b(codigo|código|erro|bug|falha)\b/.test(n))return {type:"fix"};
    if(/^\/?(melhorar|melhore|melhorias|sugestoes|sugestões)(\s|$)/.test(n)||/\b(ideias?|sugestoes?|sugestões)\b.*\b(melhoria|melhorias|melhorar|codigo|código)\b/.test(n))return {type:"improve"};
    const select=n.match(/\b(?:ideia|opcao|opção)\s*([1-5])\b/)||n.match(/\b(?:gostei|escolho|quero)\b.*\b([1-5])\b/);
    if(select)return {type:"select",value:Number(select[1])};
    if(/^\/?ideias?(\s|$)/.test(n)||/\b(dica|sugestao|sugestão)\b.*\b(jogo|game)\b/.test(n))return {type:"ideas",value:n.replace(/^\/?ideias?\s*/,"")};
    if(/^\/?(pesquisar|pesquisa|buscar|busca)(\s|$)/.test(n)||/\b(busque|buscar|pesquise|pesquisar|procure|na rede|na internet)\b/.test(n))return {type:"research",value:text.replace(/\b(busque|buscar|pesquise|pesquisa|pesquisar|procure|na rede|na internet)\b/gi,"").trim()};
    if(/\b(o que e|o que é|como funciona|como faco|como faço|como criar|como usar|explique|explica|por que|por quê|qual a melhor maneira)\b/.test(n))return {type:"question",value:text};
    if(/\b(crie|criar|gere|gerar|faça|faca|desenvolva|codifique|entregue|me de|me dê|me entregue)\b.*\b(jogo|game|codigo|código|prototipo|protótipo)\b/.test(n))return {type:"generate"};
    return {type:"fallback",value:text};
  }

      log("NATURAL: faça perguntas, mande uma URL, peça uma ideia, escolha uma ideia e peça o código.");
      return;
    }

    if(i.type==="sources"){
      if(!state.sourceList.length)log("ANABEL: nenhuma referência nesta sessão.");
      else{log("ANABEL: "+state.sourceList.length+" referência(s) disponíveis.");sources.classList.add("show");}
      return;
    }

    if(i.type==="undo"){undo();return;}
    if(i.type==="confirm"){applyPending(i.value);return;}
    if(i.type==="run"){run(editor.value);return;}
    if(i.type==="tip"){contextualTip();return;}
    if(i.type==="space"){editor.value=spaceGame();log("ANABEL: Space Invaders carregado no editor.");switchTab(1);return;}
    if(i.type==="analyze"){analyze();return;}
    if(i.type==="fix"){fixCode();return;}
    if(i.type==="improve"){improvementIdeas();return;}
    if(i.type==="refactor"){refactor();return;}
    if(i.type==="url"){await loadUrl(i.value);return;}
    if(i.type==="research"){await research(i.value);return;}
    if(i.type==="question"){await smartAnswer(i.value);return;}
    if(i.type==="ideas"){await ideas(i.value||"jogo estratégia 8-bit");return;}
    if(i.type==="select"){selectIdea(i.value);return;}
    if(i.type==="generate"){generate();return;}

    const item=known(i.value);
    if(item){await smartAnswer(i.value);return;}

    log("ANABEL: posso pesquisar, explicar, analisar o código, refatorar, gerar ideias ou executar o Sandbox.");
    log("DICA: experimente “Anabel, pesquise Canvas”, “quero uma ideia de jogo” ou “analise meu código”.");
  }

  async function sendCommand(){
    if(state.busy)return;
    const text=input.value.trim();
    if(!text)return;
    state.busy=true;send.disabled=true;input.value="";log("DEV: "+text);
    try{await handleCommand(text);}
    catch(e){console.error("Dev_Anabel:",e);log("ERRO: "+(e.message||"falha inesperada"));}
    finally{state.busy=false;send.disabled=false;input.focus();}
  }

  window.DevAnabel={
    state,
    switchTab,
    theme,
    run,
    undo,
    loadUrl,
    handleFiles,
    research,
    answer:smartAnswer,
    analyze,
    refactor,
    ideas,
    selectIdea,
    generate,
    intent
  };

  editor.addEventListener("input",()=>{if(state.language==="auto")setLanguage("auto");else setLanguage(state.language);if(detectLanguage(editor.value)==="python")renderAutocomplete(false);else autocomplete.classList.remove("show");});
  editor.addEventListener("keydown",e=>{
    if(detectLanguage(editor.value)==="python"){
      if(e.key==="Escape"&&autocomplete.classList.contains("show")){autocomplete.classList.remove("show");return;}
      if(e.ctrlKey&&e.code==="Space"){e.preventDefault();acIndex=0;renderAutocomplete(true);return;}
      if(autocomplete.classList.contains("show")&&acItems.length&&(e.key==="ArrowDown"||e.key==="ArrowUp")){
        e.preventDefault();acIndex=(acIndex+(e.key==="ArrowDown"?1:-1)+acItems.length)%acItems.length;renderAutocomplete(true);return;
      }
      if(pythonIndent(e))return;
      if(e.key==="."||e.key==="_"||/[A-Za-z0-9]/.test(e.key))setTimeout(()=>renderAutocomplete(false),0);
    }
  });
  editor.addEventListener("scroll",()=>{if(autocomplete.classList.contains("show"))placeAutocomplete();});
  autocomplete.addEventListener("mousedown",e=>{const el=e.target.closest("[data-ac-index]");if(!el)return;e.preventDefault();acceptAutocomplete(Number(el.dataset.acIndex));});
  document.addEventListener("click",e=>{if(e.target!==editor&&!autocomplete.contains(e.target))autocomplete.classList.remove("show");});
  setLanguage("auto");
  send.addEventListener("click",sendCommand);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendCommand();}});

  qsa(".quick").forEach(b=>b.addEventListener("click",()=>{input.value=b.dataset.command;sendCommand();}));
  copyCorrected.addEventListener("click",async()=>{
    if(!correctedOutput.value.trim()){log("ANABEL: não há código corrigido para copiar.");return;}
    try{
      await navigator.clipboard.writeText(correctedOutput.value);
      status.textContent="Código corrigido copiado.";
      log("ANABEL: código corrigido copiado para a área de transferência.");
    }catch(e){
      correctedOutput.focus();correctedOutput.select();
      status.textContent="Selecione e copie manualmente.";
      log("ANABEL: o navegador bloqueou a cópia automática; o código foi selecionado.");
    }
  });

  if(new URLSearchParams(location.search).get("selftest")==="1"){
    const checks=[
      ["DOM",!!canvas&&!!editor&&!!sandbox&&!!input&&!!send],
      ["Canvas",!!ctx],
      ["Intent: análise",intent("Anabel analise meu codigo").type==="analyze"],
      ["Intent: pergunta",intent("como criar um jogo").type==="question"],
      ["Intent: ideias",intent("Anabel quero uma dica de jogo de estrategia").type==="ideas"],
      ["Intent: pesquisa",intent("/pesquisar Canvas").type==="research"],
      ["Intent: Space Invaders",intent("crie space invaders").type==="space"],
      ["Intent: aprovação",intent("sim").type==="confirm"],
      ["Intent: URL",intent("https://example.com/test.html").type==="url"],
      ["Intent: código",intent("me dê o código").type==="generate"],
      ["var→let",refactorVar("var x=1;").code.includes("let x")],
      ["console.log",removeLogs("console.log(1);\nlet x=1;").count===1],
      ["Arrow",arrows("const f=function(a){return a+1;};").count===1],
      ["Sandbox",sandbox.getAttribute("sandbox")==="allow-scripts"],
      ["Python detector",detectLanguage("def soma(a,b):\n    return a+b")==="python"],
      ["Python autocomplete",pythonSuggestions().length>0],
      ["Web runner",typeof webRuntimeHTML==="function"],
      ["Mobile tabs",qsa(".tab").length===3],
      ["Mobile pad",qsa(".pad").length===3],
      ["Fontes",typeof addSource==="function"]
    ];
    const ok=checks.filter(x=>x[1]).length;
    log("SELFTEST: "+ok+"/"+checks.length+" verificações aprovadas.");
    checks.filter(x=>!x[1]).forEach(x=>log("SELFTEST FALHA: "+x[0]));
  }
})();

/* END */
</script>
</body>
</html>
