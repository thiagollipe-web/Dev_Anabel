<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Dev_Anabel — Retro Development Bot</title>
<style>
:root{--bg:#050505;--panel:#000;--border:#333;--fg:#00ff33;--glow:rgba(0,255,51,.2);--muted:#888;--warn:#ffcc00}
[data-theme="amber"]{--fg:#ffb000;--glow:rgba(255,176,0,.2)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:monospace}
body{padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px;overscroll-behavior:contain}
button,input,textarea,select{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
header{width:100%;max-width:1400px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:20px;letter-spacing:2px;text-transform:uppercase}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tool,.theme select{background:#101010;color:var(--fg);border:1px solid var(--fg);padding:7px 10px;cursor:pointer}
.theme{display:flex;gap:5px;align-items:center}
#file-input{display:none}
.mobile-tabs{display:none;width:100%;gap:5px}
.tab{flex:1;background:#101010;color:var(--muted);border:1px solid var(--border);padding:10px;cursor:pointer}
.tab.active{color:var(--fg);border-color:var(--fg)}
#workspace{width:1400px;max-width:100%;height:min(480px,64vh);min-height:310px;display:flex;gap:12px}
.panel{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.label{font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase}
canvas,#sandbox,#editor{width:100%;height:100%;min-height:0}
canvas{display:block;background:#000;border:2px solid var(--border);box-shadow:0 0 20px var(--glow)}
#editor{flex:1;resize:none;background:#0b0b0b;color:var(--fg);border:2px solid var(--border);padding:12px;outline:none;white-space:pre;font:12px/1.4 "Courier New",monospace;tab-size:4}
#sandbox{display:block;border:2px solid var(--border);background:#000}
#controls{width:1400px;max-width:100%;display:flex;flex-direction:column;gap:7px}
#input-row{display:flex;gap:6px}
#input{flex:1;min-width:0;background:#000;color:var(--fg);border:1px solid var(--fg);padding:12px;font-size:16px}
#send{background:var(--fg);color:#000;border:0;padding:0 22px;font-weight:bold;cursor:pointer}
#quick{display:flex;gap:5px;flex-wrap:wrap}
.quick{background:#101010;color:var(--fg);border:1px solid var(--fg);padding:5px 8px;font-size:10px;cursor:pointer}
#sources{display:none;max-height:130px;overflow:auto;background:#030303;border-top:1px solid var(--border);padding:7px;font-size:10px}
#sources.show{display:block}
.source{margin-bottom:6px;line-height:1.35}.source a{color:var(--fg);word-break:break-all}.source span{color:var(--muted)}
#status{font-size:10px;color:var(--muted);min-height:13px}
#pad{display:none;justify-content:center;gap:10px}
.pad{background:#202020;color:var(--fg);border:2px solid var(--fg);padding:13px 24px;touch-action:manipulation}
.drop{border-color:var(--fg)!important;box-shadow:0 0 15px var(--glow)!important}
@media(max-width:900px){.mobile-tabs{display:flex}.panel{display:none}.panel.visible{display:flex}#workspace{height:58vh;min-height:290px}.toolbar{width:100%}.toolbar>*{flex:1}#pad{display:flex}}
@media(max-width:520px){h1{font-size:16px}.theme{width:100%}.theme select{flex:1}#input-row{flex-direction:column}#send{min-height:44px}.quick{flex:1;text-align:center}.pad{flex:1}}
</style>
</head>
<body>
<header>
<h1>Dev_Anabel Core System</h1>
<div class="toolbar">
<label class="tool" for="file-input">📎 ANEXAR</label>
<input id="file-input" type="file" multiple accept=".html,.htm,.js,.mjs,.css,.json,.txt,.md,.xml,.svg,.csv,.py,.java,.c,.cpp,.h,.hpp,.cs,.ts,.tsx,.jsx">
<button class="tool" id="export" type="button">💾 EXPORTAR</button>
<button class="tool" id="undo" type="button">↶ DESFAZER</button>
<div class="theme"><span>CRT:</span><select id="theme"><option value="green">VERDE</option><option value="amber">ÂMBAR</option></select></div>
</div>
</header>
<div class="mobile-tabs">
<button class="tab active" type="button" data-tab="0">Terminal</button>
<button class="tab" type="button" data-tab="1">Código</button>
<button class="tab" type="button" data-tab="2">Live View</button>
</div>
<main id="workspace">
<section class="panel visible" id="p0"><div class="label">📟 Terminal CRT</div><canvas id="terminal" width="450" height="450"></canvas><div id="sources"></div></section>
<section class="panel" id="p1"><div class="label">💻 Código Fonte</div><textarea id="editor" spellcheck="false" placeholder="// Cole ou anexe código e documentos textuais aqui..."></textarea></section>
<section class="panel" id="p2"><div class="label">🚀 Sandbox de Execução</div><iframe id="sandbox" title="Live View" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></section>
</main>
<section id="controls">
<div id="input-row"><input id="input" autocomplete="off" autofocus placeholder="Ex.: Anabel, me dê uma ideia de jogo de estratégia 8-bit"><button id="send" type="button">EXECUTAR</button></div>
<div id="quick">
<button class="quick" data-command="/ajuda" type="button">/ajuda</button>
<button class="quick" data-command="/analisar" type="button">/analisar</button>
<button class="quick" data-command="/refatorar" type="button">/refatorar</button>
<button class="quick" data-command="/executar" type="button">/executar</button>
<button class="quick" data-command="/ideias jogo estratégia 8-bit" type="button">/ideias</button>
<button class="quick" data-command="/fontes" type="button">/fontes</button>
</div>
<div id="status"></div>
</section>
<section id="pad"><button class="pad" id="left" type="button">◀ ESQ</button><button class="pad" id="fire" type="button">FOGO</button><button class="pad" id="right" type="button">DIR ▶</button></section>
<script>

"use strict";
(()=> {
  const $=(s,r=document)=>r.querySelector(s);
  const qsa=(s,r=document)=>[...r.querySelectorAll(s)];
  const canvas=$("#terminal"),ctx=canvas.getContext("2d",{alpha:false});
  const editor=$("#editor"),sandbox=$("#sandbox"),input=$("#input"),send=$("#send");
  const fileInput=$("#file-input"),sources=$("#sources"),status=$("#status");
  const state={
    theme:"green",color:"#00ff33",busy:false,queued:false,sandboxUrl:"",
    history:[
      "ANABEL: sistema iniciado.",
      "ANABEL: bot local sem LLM.",
      "ANABEL: conhecimento, regras, pesquisa e ferramentas ativas."
    ],
    sourceList:[],snapshots:[],ideas:[],selectedIdea:null,pendingAction:null
  };

  const norm=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
  const esc=v=>String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
  function log(v){state.history.push(String(v));drawLater();}
  function drawLater(){if(state.queued)return;state.queued=requestAnimationFrame(()=>{state.queued=false;draw();});}
  function draw(){
    const r=canvas.getBoundingClientRect(),d=Math.max(1,Math.min(2,devicePixelRatio||1));
    const w=Math.max(1,Math.floor((r.width||450)*d)),h=Math.max(1,Math.floor((r.height||450)*d));
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
    const cw=r.width||450,ch=r.height||450;
    ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,cw,ch);
    ctx.fillStyle=state.color;ctx.shadowColor=state.color;ctx.shadowBlur=3;ctx.font="12px monospace";ctx.textBaseline="top";
    const lh=17,max=Math.max(1,Math.floor((ch-12)/lh)),start=Math.max(0,state.history.length-max),chars=Math.max(30,Math.floor((cw-18)/7.1));
    for(let i=start;i<state.history.length;i++){let t=state.history[i].replace(/\s+/g," ").trim();if(t.length>chars)t=t.slice(0,chars-1)+"…";ctx.fillText(t,9,7+(i-start)*lh);}
    ctx.shadowBlur=0;
  }
  function switchTab(i){
    i=Number(i);if(![0,1,2].includes(i))return;
    qsa(".tab").forEach((b,n)=>{b.classList.toggle("active",n===i);b.setAttribute("aria-selected",String(n===i));});
    qsa(".panel").forEach((p,n)=>p.classList.toggle("visible",n===i));
    if(i===0)drawLater();
  }
  function theme(v){
    state.theme=v==="amber"?"amber":"green";
    document.documentElement.toggleAttribute("data-theme",state.theme==="amber");
    if(state.theme==="amber")state.color="#ffb000";else state.color="#00ff33";
    const title=sandbox.contentDocument?.getElementById("title");if(title)title.style.color=state.color;
    drawLater();
  }
  function snapshot(label){state.snapshots.push({label,code:editor.value});if(state.snapshots.length>40)state.snapshots.shift();}
  function undo(){
    const x=state.snapshots.pop();if(!x){log("ANABEL: não há estado anterior.");return;}
    editor.value=x.code;log("ANABEL: estado restaurado → "+x.label);switchTab(1);
  }
  function revokeSandbox(){if(state.sandboxUrl){URL.revokeObjectURL(state.sandboxUrl);state.sandboxUrl="";}}
  function run(code){
    if(!String(code||"").trim()){log("ANABEL: não há código para executar.");return false;}
    revokeSandbox();
    const themed=state.theme==="amber"?String(code).replaceAll("#00ff33","#ffb000").replaceAll("#0f3","#ffb000"):String(code);
    state.sandboxUrl=URL.createObjectURL(new Blob([themed],{type:"text/html;charset=utf-8"}));
    sandbox.src=state.sandboxUrl;log("ANABEL: código enviado ao Sandbox isolado.");switchTab(2);return true;
  }
  function post(command){
    if(!sandbox.contentWindow){log("ANABEL: Sandbox ainda não está pronto.");return;}
    sandbox.contentWindow.postMessage({source:"dev-anabel",command},"*");
  }
  function renderSources(){
    if(!state.sourceList.length){sources.classList.remove("show");sources.innerHTML="";return;}
    sources.innerHTML=state.sourceList.slice(-15).map(s=>'<div class="source"><span>['+esc(s.kind)+']</span> <a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.title)+'</a><div>'+esc(s.note)+'</div></div>').join("");
    sources.classList.add("show");
  }
  function addSource(s){
    if(!s?.url||state.sourceList.some(x=>x.url===s.url))return;
    state.sourceList.push({kind:s.kind||"WEB",title:s.title||s.url,url:s.url,note:s.note||""});renderSources();
  }
  async function handleFiles(files){
    for(const file of [...(files||[])]){
      const ext=(file.name.split(".").pop()||"").toLowerCase();
      const allowed=["html","htm","js","mjs","css","json","txt","md","xml","svg","csv","py","java","c","cpp","h","hpp","cs","ts","tsx","jsx"];
      if(!allowed.includes(ext)){log("ANABEL: formato não suportado → "+file.name);continue;}
      try{snapshot("antes de anexar "+file.name);editor.value=await file.text();log("SISTEMA: arquivo anexado → "+file.name);}
      catch(e){console.error(e);log("ANABEL: falha ao ler "+file.name);}
    }
    switchTab(1);fileInput.value="";
  }
  async function loadUrl(url){
    let target=url;
    try{
      const u=new URL(url),p=u.pathname.split("/").filter(Boolean),i=p.indexOf("blob");
      if(u.hostname==="github.com"&&i>=2&&p.length>i+2)target="https://raw.githubusercontent.com/"+p[0]+"/"+p[1]+"/"+p[i+1]+"/"+p.slice(i+2).join("/");
    }catch(e){}
    status.textContent="Carregando URL…";
    try{
      const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);
      const r=await fetch(target,{signal:c.signal});clearTimeout(timer);
      if(!r.ok)throw new Error("HTTP "+r.status);
      snapshot("antes do carregamento remoto");editor.value=await r.text();
      addSource({kind:"URL",title:target,url:target,note:"Arquivo carregado diretamente da rede."});
      log("ANABEL: conteúdo remoto carregado.");switchTab(1);status.textContent="URL carregada.";
    }catch(e){console.error(e);log("ANABEL: a URL não pôde ser lida. O servidor pode bloquear CORS.");status.textContent="Falha na URL.";}
  }
  function exportCode(){
    if(!editor.value.trim()){log("ANABEL: buffer vazio.");return;}
    const url=URL.createObjectURL(new Blob([editor.value],{type:"text/html;charset=utf-8"})),a=document.createElement("a");
    a.href=url;a.download="dev_anabel_export.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0);log("ANABEL: exportação concluída.");
  }
  Object.assign(window,{switchTab,changeTheme:theme,exportCode,handleFileAttach:i=>handleFiles(i?.files||[]),DevAnabel:{state,switchTab,theme,run,undo,loadUrl,handleFiles}});
  window.addEventListener("resize",drawLater,{passive:true});
  window.addEventListener("orientationchange",drawLater,{passive:true});
  sandbox.addEventListener("load",()=>{const t=sandbox.contentDocument?.getElementById("title");if(t)t.style.color=state.color;});
  fileInput.addEventListener("change",e=>handleFiles(e.target.files));
  $("#export").addEventListener("click",exportCode);
  $("#undo").addEventListener("click",undo);
  $("#theme").addEventListener("change",e=>theme(e.target.value));
  qsa(".tab").forEach((b,i)=>b.addEventListener("click",()=>switchTab(i)));
  $("#left").addEventListener("pointerdown",e=>{e.preventDefault();post("left");});
  $("#fire").addEventListener("pointerdown",e=>{e.preventDefault();post("fire");});
  $("#right").addEventListener("pointerdown",e=>{e.preventDefault();post("right");});
  ["dragenter","dragover"].forEach(t=>editor.addEventListener(t,e=>{e.preventDefault();editor.classList.add("drop");}));
  editor.addEventListener("dragleave",e=>{e.preventDefault();editor.classList.remove("drop");});
  editor.addEventListener("drop",e=>{e.preventDefault();editor.classList.remove("drop");handleFiles(e.dataTransfer.files);});
  window.addEventListener("beforeunload",revokeSandbox);
  draw();


  const KB=[
    {keys:["fetch","fetch javascript"],title:"fetch()",text:"fetch() faz uma requisição de rede e devolve uma Promise com a resposta.",example:"const resposta=await fetch(url);",tip:"Verifique response.ok e trate falhas de rede e CORS.",url:"https://developer.mozilla.org/docs/Web/API/Window/fetch",source:"MDN — Fetch API"},
    {keys:["async await","async/await"],title:"async/await",text:"async/await torna mais legível o código que espera resultados assíncronos. await espera uma Promise dentro de uma função async.",example:"async function carregar(){ const r=await fetch(url); }",tip:"Use try/catch para tratar falhas.",url:"https://developer.mozilla.org/docs/Web/JavaScript/Reference/Statements/async_function",source:"MDN — async function"},
    {keys:["array","vetor"],title:"Array",text:"Array é uma lista ordenada. A primeira posição é 0.",example:"const frutas=['maçã','uva'];",tip:"map(), filter() e find() são úteis para transformar e pesquisar listas.",url:"https://developer.mozilla.org/docs/Web/JavaScript/Reference/Global_Objects/Array",source:"MDN — Array"},
    {keys:["promise","promises"],title:"Promise",text:"Promise representa uma operação cujo resultado pode chegar depois.",example:"fetch(url).then(r=>r.json());",tip:"async/await costuma facilitar a leitura.",url:"https://developer.mozilla.org/docs/Web/JavaScript/Reference/Global_Objects/Promise",source:"MDN — Promise"},
    {keys:["canvas","canvas api"],title:"Canvas 2D",text:"Canvas é uma área de desenho controlada por JavaScript. É útil para jogos e visualizações.",example:"const ctx=canvas.getContext('2d');",tip:"Para animações, prefira requestAnimationFrame.",url:"https://developer.mozilla.org/docs/Web/API/CanvasRenderingContext2D",source:"MDN — CanvasRenderingContext2D"},
    {keys:["dom","document object model"],title:"DOM",text:"DOM é a representação dos elementos HTML que o JavaScript pode ler e alterar.",example:"document.querySelector('h1').textContent='Olá';",tip:"Guarde referências usadas muitas vezes.",url:"https://developer.mozilla.org/docs/Web/API/Document_Object_Model",source:"MDN — DOM"},
    {keys:["postmessage","post message"],title:"postMessage",text:"postMessage permite enviar mensagens entre janelas e iframes.",example:"frame.contentWindow.postMessage({command:'left'},'*');",tip:"Valide event.source e os dados recebidos antes de agir.",url:"https://developer.mozilla.org/docs/Web/API/Window/postMessage",source:"MDN — postMessage"},
    {keys:["cors","cross origin"],title:"CORS",text:"CORS controla quando uma página pode ler respostas de outro domínio.",example:"fetch('https://exemplo.com/dados.json');",tip:"O navegador pode bloquear a leitura mesmo quando a URL existe.",url:"https://developer.mozilla.org/docs/Web/HTTP/Guides/CORS",source:"MDN — CORS"},
    {keys:["var let","var por let","var versus let"],title:"var x let",text:"let tem escopo de bloco. var segue regras antigas de escopo.",example:"let pontos=0; const nome='Anabel';",tip:"Use const quando não houver reatribuição.",url:"https://developer.mozilla.org/docs/Web/JavaScript/Reference/Statements/let",source:"MDN — let"},
    {keys:["console.log","console log"],title:"console.log()",text:"console.log() envia uma mensagem ao console e é útil durante a depuração.",example:"console.log('teste');",tip:"Remova logs de diagnóstico desnecessários no código final.",url:"https://developer.mozilla.org/docs/Web/API/console/log_static",source:"MDN — console.log()"},
    {keys:["arrow function","arrow functions","funcao seta","função seta"],title:"Arrow Function",text:"Arrow Function é uma sintaxe curta para funções e tem regras próprias de this.",example:"const dobro=x=>x*2;",tip:"A Anabel só converte automaticamente funções simples com retorno direto.",url:"https://developer.mozilla.org/docs/Web/JavaScript/Reference/Functions/Arrow_functions",source:"MDN — Arrow functions"}
  ];

  const IDEAS=[
    {title:"Reino dos 16 Turnos",pitch:"Transforme uma vila em um reino em 16 turnos; economia, população, defesa e expansão disputam o mesmo orçamento.",mechanics:["recursos","território","defesa","eventos","16 turnos"]},
    {title:"Fronteira de Pixels",pitch:"Controle um posto avançado. Explore, construa defesa ou negocie recursos com regiões vizinhas.",mechanics:["mapa","recursos","defesa","negociação"]},
    {title:"Comandante 8-Bit",pitch:"Controle unidades em uma grade e capture pontos estratégicos antes do limite de rodadas.",mechanics:["grade","energia","captura","turnos"]},
    {title:"Colônia Pixel",pitch:"Mantenha uma pequena colônia viva enquanto comida, população e defesa mudam a cada ciclo.",mechanics:["sobrevivência","recursos","eventos","população"]},
    {title:"Núcleo de Guerra",pitch:"Reorganize energia e posições a cada rodada para romper o núcleo adversário.",mechanics:["energia","posicionamento","ataque","rodadas"]}
  ];

  function known(query){
    const n=norm(query);let best=null,bestScore=0;
    KB.forEach(k=>{let score=0;k.keys.forEach(key=>{const nk=norm(key);if(n.includes(nk))score+=nk.length;});if(score>bestScore){bestScore=score;best=k;}});
    return best;
  }

  async function httpJson(url,ms=10000){
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);
    try{const r=await fetch(url,{signal:controller.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}
    finally{clearTimeout(timer);}
  }

  async function research(query){
    const q=String(query||"").trim();
    if(!q){log("ANABEL: informe o assunto da pesquisa.");return [];}
    status.textContent="Pesquisando: "+q;
    log("ANABEL: pesquisa na rede → "+q);
    const urls=[
      ["WIKIPEDIA","https://pt.wikipedia.org/w/rest.php/v1/search/page?q="+encodeURIComponent(q)+"&limit=5"],
      ["STACKOVERFLOW","https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&q="+encodeURIComponent(q)+"&site=pt.stackoverflow&pagesize=5&filter=default"],
      ["GITHUB","https://api.github.com/search/repositories?q="+encodeURIComponent(q)+"&per_page=5&sort=stars&order=desc"]
    ];
    const result=await Promise.allSettled(urls.map(x=>httpJson(x[1])));
    const found=[],seen=new Set();
    result.forEach((r,i)=>{
      if(r.status!=="fulfilled")return;
      const kind=urls[i][0],data=r.value;
      const items=kind==="WIKIPEDIA"?(data.pages||[]).map(x=>({title:x.title||x.key,url:x.content_urls?.desktop?.page||("https://pt.wikipedia.org/wiki/"+encodeURIComponent(x.key||x.title)),note:x.description||""})):
        kind==="STACKOVERFLOW"?(data.items||[]).map(x=>({title:x.title,url:x.link,note:(x.tags||[]).join(", ")})):
        (data.items||[]).map(x=>({title:x.full_name,url:x.html_url,note:(x.stargazers_count||0)+" stars · "+(x.description||"sem descrição")}));
      items.forEach(x=>{if(x.url&&!seen.has(x.url)){seen.add(x.url);found.push({kind,title:x.title,url:x.url,note:x.note});}});
    });
    found.slice(0,10).forEach(addSource);
    log("ANABEL: pesquisa concluída → "+Math.min(found.length,10)+" referência(s).");
    status.textContent=found.length+" referência(s).";
    return found.slice(0,10);
  }

  function simple(text){
    return String(text||"").replace(/\bPromise\b/gi,"resultado que pode chegar depois").replace(/\bcallback\b/gi,"função chamada depois").replace(/\bassíncrono\b/gi,"que continua enquanto outra tarefa termina").replace(/\bassíncrona\b/gi,"que continua enquanto outra tarefa termina");
  }

  function mask(code){
    let out="",mode="code",quote="";
    for(let i=0;i<code.length;i++){
      const c=code[i],n=code[i+1];
      if(mode==="code"){
        if(c==="/"&&n==="/"){out+="  ";mode="line";i++;continue;}
        if(c==="/"&&n==="*"){out+="  ";mode="block";i++;continue;}
        if(c==="\""||c==="'"||c===String.fromCharCode(96)){out+=" ";quote=c;mode="string";continue;}
        out+=c;continue;
      }
      if(mode==="line"){out+=c==="\n"?"\n":" ";if(c==="\n")mode="code";continue;}
      if(mode==="block"){out+=c==="\n"?"\n":" ";if(c==="*"&&n==="/"){out+=" ";i++;mode="code";}continue;}
      out+=c==="\n"?"\n":" ";
      if(c==="\\"){out+=" ";i++;continue;}
      if(c===quote)mode="code";
    }
    return out;
  }

  function refactorVar(code){
    const m=mask(code);let out="",count=0;
    for(let i=0;i<code.length;){
      const prev=i?m[i-1]:" ",next=m[i+3]||" ";
      if(m.slice(i,i+3)==="var"&&/[^A-Za-z0-9_$]/.test(prev)&&/\s/.test(next)){out+="let";i+=3;count++;}
      else{out+=code[i];i++;}
    }
    return {code:out,count};
  }

  function removeLogs(code){
    let count=0;
    const out=code.split("\n").filter(line=>{
      if(/^\s*console\.log\s*\([^;]*\)\s*;?\s*$/.test(line)){count++;return false;}
      return true;
    });
    return {code:out.join("\n"),count};
  }

  function arrows(code){
    let count=0;
    const re=/(?:const\s+([A-Za-z_$][\w$]*)\s*=\s*)?function\s*\(([^)]*)\)\s*\{\s*return\s+([^;{}]+);?\s*\}\s*;?/g;
    const out=code.replace(re,(match,name,args,expr)=>{
      count++;
      const body="("+args.trim()+") => "+expr.trim();
      return name?"const "+name+" = "+body+";":body+";";
    });
    return {code:out,count};
  }

  function analyze(){
    const code=editor.value;
    if(!code.trim()){log("ANABEL: editor vazio.");return null;}
    const m=mask(code);
    const result={
      varCount:(m.match(/\bvar\b/g)||[]).length,
      logCount:(m.match(/\bconsole\.log\s*\(/g)||[]).length,
      functionCount:(m.match(/\bfunction\b/g)||[]).length,
      arrowCount:(m.match(/=>/g)||[]).length,
      fetchCount:(m.match(/\bfetch\s*\(/g)||[]).length
    };
    log("ANABEL: análise concluída.");
    log("ANÁLISE: var="+result.varCount+" · console.log="+result.logCount+" · function="+result.functionCount+" · arrow="+result.arrowCount+" · fetch="+result.fetchCount);
    if(result.fetchCount)log("DICA: confira response.ok, tratamento de erros e CORS.");
    if(/\bawait\b/.test(m))log("DICA: código assíncrono encontrado; considere try/catch.");
    if(result.varCount)log("PERGUNTA DE ESCOPO: esta variável precisa existir fora do bloco onde foi criada?");
    if(result.fetchCount)log("PERGUNTA DE ASSINCRONISMO: o que deve acontecer quando a rede falhar ou responder devagar?");
    if(/\bArray\b|\bObject\b|\bMap\b|\bSet\b/.test(m))log("PERGUNTA DE ESTRUTURA: você precisa preservar ordem, buscar por chave ou impedir duplicidades?");
    state.pendingAction=(result.varCount||result.logCount||result.functionCount>result.arrowCount)?{type:"refactor"}:null;
    if(state.pendingAction)log("ANABEL: posso aplicar as correções básicas. Responda sim, s, yes, go ou ok.");
    if(!result.varCount&&!result.logCount&&!result.fetchCount)log("DICA: nenhum dos padrões básicos conhecidos foi encontrado.");
    return result;
  }

  function refactor(){
    if(!editor.value.trim()){log("ANABEL: editor vazio.");return null;}
    snapshot("antes da refatoração");
    let code=editor.value;
    const a=refactorVar(code);code=a.code;
    const b=removeLogs(code);code=b.code;
    const c=arrows(code);code=c.code;
    editor.value=code;
    log("ANABEL: refatoração aplicada → var→let: "+a.count+" · console.log removidos: "+b.count+" · arrow: "+c.count);
    if(a.count){addSource({kind:"REF",title:"MDN — let",url:"https://developer.mozilla.org/docs/Web/JavaScript/Reference/Statements/let",note:"Justificativa para let."});log("DICA: use const quando o valor não for reatribuído.");}
    if(b.count)addSource({kind:"REF",title:"MDN — console.log()",url:"https://developer.mozilla.org/docs/Web/API/console/log_static",note:"Referência da Console API."});
    if(c.count)addSource({kind:"REF",title:"MDN — Arrow functions",url:"https://developer.mozilla.org/docs/Web/JavaScript/Reference/Functions/Arrow_functions",note:"A Anabel transforma apenas funções simples com retorno direto."});
    switchTab(1);
    return {varCount:a.count,logCount:b.count,arrowCount:c.count};
  }

  function strategyGame(){
    return '<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reino dos 16 Turnos</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#00ff33;font-family:monospace;padding:12px}main{max-width:760px;margin:auto}h1{text-align:center}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stat,button,#msg{border:1px solid #00ff33;background:#080808;color:#00ff33;padding:8px;font:700 12px monospace}canvas{width:100%;display:block;margin-top:7px;border:2px solid #00ff33;image-rendering:pixelated}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}#msg{margin-top:7px;min-height:40px}@media(max-width:520px){.hud{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>REINO DOS 16 TURNOS</h1><div class="hud"><div class="stat">TURNO <b id="t">1</b>/16</div><div class="stat">COMIDA <b id="f">30</b></div><div class="stat">OURO <b id="g">20</b></div><div class="stat">DEFESA <b id="d">10</b></div></div><canvas id="m" width="480" height="300"></canvas><div class="actions"><button data-a="f">PRODUZIR</button><button data-a="g">MINA</button><button data-a="d">DEFENDER</button><button data-a="e">EXPANDIR</button></div><div id="msg">Escolha uma ação por turno.</div></main><script>(()=>{const c=document.getElementById("m"),x=c.getContext("2d"),t=document.getElementById("t"),f=document.getElementById("f"),g=document.getElementById("g"),d=document.getElementById("d"),msg=document.getElementById("msg");let s={t:1,f:30,g:20,d:10,l:1,end:false};function draw(){x.clearRect(0,0,480,300);x.fillStyle="#071007";x.fillRect(0,0,480,300);for(let y=0;y<5;y++)for(let i=0;i<8;i++){x.strokeStyle="#16451d";x.strokeRect(i*60,y*60,60,60);if((i+y)%4===0){x.fillStyle="#00ff33";x.fillRect(i*60+24,y*60+24,12,12)}}x.fillStyle="#00ff33";x.fillRect(190,120,100,58);x.fillStyle="#000";x.font="14px monospace";x.fillText("VILA",222,153);t.textContent=Math.min(s.t,16);f.textContent=s.f;g.textContent=s.g;d.textContent=s.d}function next(m){if(s.end)return;s.f-=2;if(s.f<=0){s.end=true;msg.textContent="DERROTA: faltou comida.";draw();return}s.t++;msg.textContent=m;if(s.t>16){s.end=true;msg.textContent=(s.l>=6&&s.d>=20&&s.g>=20)?"VITÓRIA: reino consolidado.":"FIM: reino não consolidado."}draw()}function act(a){if(s.end)return;if(a==="f"){s.f+=8;next("A produção agrícola aumentou a comida.")}else if(a==="g"){s.g+=7;next("A mina trouxe ouro.")}else if(a==="d"){s.d+=5;s.g=Math.max(0,s.g-3);next("A defesa foi reforçada.")}else{s.l++;s.g=Math.max(0,s.g-5);next("Território expandido.")}}document.querySelectorAll("button").forEach(b=>b.onclick=()=>act(b.dataset.a));addEventListener("message",e=>{if(e.source!==parent)return;const q=e.data?.command;if(q==="left")act("d");if(q==="right")act("e")});draw()})()<\/script></body></html>';
  }

  function spaceGame(){
    return '<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Invaders</title><style>body{margin:0;background:#000;color:#00ff33;font-family:monospace;display:grid;place-items:center;min-height:100vh}canvas{width:min(92vw,600px);border:2px solid #00ff33;image-rendering:pixelated}</style></head><body><canvas id="g" width="360" height="260"></canvas><script>(()=>{const c=document.getElementById("g"),x=c.getContext("2d");let p=166,shot=null,score=0,en=[];for(let y=0;y<2;y++)for(let i=0;i<7;i++)en.push({x:34+i*46,y:34+y*24});function mv(d){p=Math.max(5,Math.min(330,p+d*14))}addEventListener("keydown",e=>{if(e.key==="ArrowLeft")mv(-1);if(e.key==="ArrowRight")mv(1);if(e.code==="Space"&&!shot)shot={x:p+12,y:230}});addEventListener("message",e=>{if(e.source!==parent)return;const q=e.data?.command;if(q==="left")mv(-1);if(q==="right")mv(1);if(q==="fire"&&!shot)shot={x:p+12,y:230}});function loop(){x.clearRect(0,0,360,260);x.fillStyle="#00ff33";x.font="12px monospace";x.fillText("SCORE "+String(score).padStart(4,"0"),8,15);en.forEach(a=>x.fillRect(a.x,a.y,24,12));x.fillRect(p,236,28,8);x.fillRect(p+12,228,4,8);if(shot){shot.y-=7;x.fillRect(shot.x,shot.y,3,8);for(let i=en.length-1;i>=0;i--){const a=en[i];if(shot.x>=a.x-2&&shot.x<=a.x+26&&shot.y<=a.y+12&&shot.y+8>=a.y){en.splice(i,1);shot=null;score+=10;break}}if(shot&&shot.y<0)shot=null}requestAnimationFrame(loop)}requestAnimationFrame(loop)})()<\/script></body></html>';
  }

  function selectIdea(n){
    const i=Math.max(1,Math.min(5,Number(n)||1))-1;
    const x=state.ideas[i];
    if(!x){log("ANABEL: não há ideias carregadas.");return;}
    state.selectedIdea=x;
    log("ANABEL: ideia selecionada → "+x.title);
    log("ANABEL: agora diga “me dê o código”.");
  }

  function generate(){
    const x=state.selectedIdea||IDEAS[0];
    snapshot("antes de gerar "+x.title);
    editor.value=/space|invaders/i.test(x.title)?spaceGame():strategyGame();
    log("ANABEL: protótipo gerado → "+x.title);
    switchTab(1);
  }


  async function translateSimple(text){
    const original=String(text||"");
    try{
      const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(original.slice(0,480))+"&langpair=en|pt-BR";
      const data=await httpJson(url,8000);
      const translated=data?.responseData?.translatedText;
      if(translated)return translated;
    }catch(e){}
    return original
      .replace(/\bThis function is a reusable block of code\.?/gi,"Esta função é um bloco reutilizável de código.")
      .replace(/\bThis\b/gi,"Esta")
      .replace(/\bthat\b/gi,"que")
      .replace(/\bfunction\b/gi,"função")
      .replace(/\breusable\b/gi,"reutilizável")
      .replace(/\bblock of code\b/gi,"bloco de código")
      .replace(/\bcode\b/gi,"código")
      .replace(/\bprogramming\b/gi,"programação")
      .replace(/\bgame\b/gi,"jogo")
      .replace(/\bstrategy\b/gi,"estratégia")
      .replace(/\blibrary\b/gi,"biblioteca")
      .replace(/\bdata\b/gi,"dados")
      .replace(/\bweb\b/gi,"web");
  }

  async function ideas(query){
    const q=String(query||"jogo estratégia 8-bit").trim();
    await research(q+" game design");
    state.ideas=[...IDEAS];
    log("ANABEL: agora vou separar referências de pesquisa de propostas originais.");
    state.ideas.forEach((x,i)=>{
      log("IDEIA "+(i+1)+" — "+x.title);
      log("  "+x.pitch);
      log("  MECÂNICAS: "+x.mechanics.join(", "));
    });
    log("ANABEL: escolha uma ideia pelo número. Depois diga “me dê o código”.");
  }

  async function smartAnswer(query){
    const item=known(query);
    if(item){
      log("ANABEL: "+item.title);
      log("EXPLICAÇÃO: "+item.text);
      log("EXEMPLO: "+item.example);
      log("DICA: "+item.tip);
      addSource({kind:"LOCAL",title:item.source,url:item.url,note:"Referência técnica da base local."});
      return;
    }
    const found=await research(query);
    if(!found.length){
      log("ANABEL: não encontrei material suficiente para responder com segurança.");
      return;
    }
    let detail=found[0].note||found[0].title;
    if(/\b(the|this|function|game|library|data|how|what)\b/i.test(detail))detail=await translateSimple(detail);
    log("RESPOSTA SIMPLIFICADA: "+detail);
    log("DICA: a referência está na área FONTES; consulte o original para contexto completo.");
  }

  function intent(text){
    const n=norm(text);
    const url=text.match(/https?:\/\/[^\s<>"]+/i)?.[0]?.replace(/[),.;]+$/,"");
    if(url)return {type:"url",value:url};
    if(/^\/?(ajuda|help|comandos)(\s|$)/.test(n))return {type:"help"};
    if(/^\/?(fontes?|source)(\s|$)/.test(n))return {type:"sources"};
    if(/^\/?(desfazer|undo|voltar)(\s|$)/.test(n))return {type:"undo"};
    if(/^(sim|s|yes|y|go|ok|okay|pode|manda|confirmo)$/.test(n)||/^(nao|não|n|no|cancelar|cancelo)$/.test(n))return {type:"confirm",value:n};
    if(/^\/?(executar|rodar|run|play)(\s|$)/.test(n))return {type:"run"};
    if(/^\/?dica(\s|$)/.test(n)||/\bdica\b.*\b(codigo|código|erro|programacao|programação)\b/.test(n))return {type:"tip"};
    if(/\bspace\s*invaders?\b|\binvaders?\b/.test(n))return {type:"space"};
    if(/^\/?(analisar|analise|audit|diagnostico)(\s|$)/.test(n)||/\b(analisar|analise|audit|diagnostico)\b.*\b(codigo|editor)\b/.test(n))return {type:"analyze"};
    if(/^\/?(refatorar|modernizar|otimizar)(\s|$)/.test(n)||/console\.log|\bvar\b.*\blet\b|arrow function/.test(n))return {type:"refactor"};
    const select=n.match(/\b(?:ideia|opcao|opção)\s*([1-5])\b/)||n.match(/\b(?:gostei|escolho|quero)\b.*\b([1-5])\b/);
    if(select)return {type:"select",value:Number(select[1])};
    if(/^\/?ideias?(\s|$)/.test(n)||/\b(dica|sugestao|sugestão)\b.*\b(jogo|game)\b/.test(n))return {type:"ideas",value:n.replace(/^\/?ideias?\s*/,"")};
    if(/^\/?(pesquisar|pesquisa|buscar|busca)(\s|$)/.test(n)||/\b(busque|buscar|pesquise|pesquisar|procure|na rede|na internet)\b/.test(n))return {type:"research",value:text.replace(/\b(busque|buscar|pesquise|pesquisa|pesquisar|procure|na rede|na internet)\b/gi,"").trim()};
    if(/\b(o que e|o que é|como funciona|como faco|como faço|como criar|como usar|explique|explica|por que|por quê|qual a melhor maneira)\b/.test(n))return {type:"question",value:text};
    if(/\b(crie|criar|gere|gerar|faça|faca|desenvolva|codifique|entregue|me de|me dê|me entregue)\b.*\b(jogo|game|codigo|código|prototipo|protótipo)\b/.test(n))return {type:"generate"};
    return {type:"fallback",value:text};
  }

  function applyPending(text){
    const n=norm(text);
    if(!state.pendingAction){log("ANABEL: não há nenhuma ação aguardando aprovação.");return;}
    if(/^(nao|não|n|no|cancelar|cancelo)$/.test(n)){state.pendingAction=null;log("ANABEL: ação cancelada.");return;}
    if(/^(sim|s|yes|y|go|ok|okay|pode|manda|confirmo)$/.test(n)){
      const action=state.pendingAction;state.pendingAction=null;
      if(action.type==="refactor")refactor();
      else if(action.type==="run")run(editor.value);
      return;
    }
    log("ANABEL: responda sim, s, yes, go, ok ou não.");
  }

  function contextualTip(){
    const m=mask(editor.value);
    if(!m.trim()){log("DICA: escreva ou anexe um código para receber uma dica contextual.");return;}
    if(/\bfetch\s*\(/.test(m)){log("DICA: trate response.ok, erros de rede e CORS.");addSource({kind:"DICA",title:"MDN — Fetch API",url:"https://developer.mozilla.org/docs/Web/API/Window/fetch",note:"Referência da Fetch API."});return;}
    if(/getContext\s*\(\s*["']2d["']\)/.test(m)){log("DICA: para animações, prefira requestAnimationFrame.");addSource({kind:"DICA",title:"MDN — requestAnimationFrame",url:"https://developer.mozilla.org/docs/Web/API/Window/requestAnimationFrame",note:"Referência de animação."});return;}
    if(/\b(Array|Object|Map|Set)\b/.test(m)){log("DICA: escolha a estrutura pelos padrões de acesso: ordem, chave ou unicidade.");addSource({kind:"DICA",title:"MDN — JavaScript data structures",url:"https://developer.mozilla.org/docs/Web/JavaScript/Data_structures",note:"Referência de estruturas de dados."});return;}
    log("DICA: mantenha cada função com uma responsabilidade clara e valide entradas.");
  }

  async function handleCommand(text){
    const i=intent(text);

    if(i.type==="help"){
      log("COMANDOS: /ajuda · /pesquisar assunto · /ideias assunto · /analisar · /refatorar · /executar · /desfazer · /fontes");
      log("NATURAL: faça perguntas, mande uma URL, peça uma ideia, escolha uma ideia e peça o código.");
      return;
    }

    if(i.type==="sources"){
      if(!state.sourceList.length)log("ANABEL: nenhuma referência nesta sessão.");
      else{log("ANABEL: "+state.sourceList.length+" referência(s) disponíveis.");sources.classList.add("show");}
      return;
    }

    if(i.type==="undo"){undo();return;}
    if(i.type==="confirm"){applyPending(i.value);return;}
    if(i.type==="run"){run(editor.value);return;}
    if(i.type==="tip"){contextualTip();return;}
    if(i.type==="space"){editor.value=spaceGame();log("ANABEL: Space Invaders carregado no editor.");switchTab(1);return;}
    if(i.type==="analyze"){analyze();return;}
    if(i.type==="refactor"){refactor();return;}
    if(i.type==="url"){await loadUrl(i.value);return;}
    if(i.type==="research"){await research(i.value);return;}
    if(i.type==="question"){await smartAnswer(i.value);return;}
    if(i.type==="ideas"){await ideas(i.value||"jogo estratégia 8-bit");return;}
    if(i.type==="select"){selectIdea(i.value);return;}
    if(i.type==="generate"){generate();return;}

    const item=known(i.value);
    if(item){await smartAnswer(i.value);return;}

    log("ANABEL: posso pesquisar, explicar, analisar o código, refatorar, gerar ideias ou executar o Sandbox.");
    log("DICA: experimente “Anabel, pesquise Canvas”, “quero uma ideia de jogo” ou “analise meu código”.");
  }

  async function sendCommand(){
    if(state.busy)return;
    const text=input.value.trim();
    if(!text)return;
    state.busy=true;send.disabled=true;input.value="";log("DEV: "+text);
    try{await handleCommand(text);}
    catch(e){console.error("Dev_Anabel:",e);log("ERRO: "+(e.message||"falha inesperada"));}
    finally{state.busy=false;send.disabled=false;input.focus();}
  }

  window.DevAnabel={
    state,
    switchTab,
    theme,
    run,
    undo,
    loadUrl,
    handleFiles,
    research,
    answer:smartAnswer,
    analyze,
    refactor,
    ideas,
    selectIdea,
    generate,
    intent
  };

  send.addEventListener("click",sendCommand);
  input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendCommand();}});

  qsa(".quick").forEach(b=>b.addEventListener("click",()=>{input.value=b.dataset.command;sendCommand();}));

  if(new URLSearchParams(location.search).get("selftest")==="1"){
    const checks=[
      ["DOM",!!canvas&&!!editor&&!!sandbox&&!!input&&!!send],
      ["Canvas",!!ctx],
      ["Intent: análise",intent("Anabel analise meu codigo").type==="analyze"],
      ["Intent: pergunta",intent("como criar um jogo").type==="question"],
      ["Intent: ideias",intent("Anabel quero uma dica de jogo de estrategia").type==="ideas"],
      ["Intent: pesquisa",intent("/pesquisar Canvas").type==="research"],
      ["Intent: Space Invaders",intent("crie space invaders").type==="space"],
      ["Intent: aprovação",intent("sim").type==="confirm"],
      ["Intent: URL",intent("https://example.com/test.html").type==="url"],
      ["Intent: código",intent("me dê o código").type==="generate"],
      ["var→let",refactorVar("var x=1;").code.includes("let x")],
      ["console.log",removeLogs("console.log(1);\nlet x=1;").count===1],
      ["Arrow",arrows("const f=function(a){return a+1;};").count===1],
      ["Sandbox",sandbox.getAttribute("sandbox")==="allow-scripts"],
      ["Mobile tabs",qsa(".tab").length===3],
      ["Mobile pad",qsa(".pad").length===3],
      ["Fontes",typeof addSource==="function"]
    ];
    const ok=checks.filter(x=>x[1]).length;
    log("SELFTEST: "+ok+"/"+checks.length+" verificações aprovadas.");
    checks.filter(x=>!x[1]).forEach(x=>log("SELFTEST FALHA: "+x[0]));
  }
})();
